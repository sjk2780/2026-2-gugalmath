<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수업 활동</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root{
    --bg:#FAFAF8; --ink:#1A1A1A; --sub:#6B7280; --line:#E5E7EB;
    --blue:#2563EB; --red:#DC2626; --ok:#059669; --okbg:#ECFDF5;
    --panel:#FFFFFF; --accent:#0D9488;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  input:focus::placeholder, textarea:focus::placeholder{ color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard',system-ui,sans-serif; line-height:1.6; -webkit-text-size-adjust:100%; }
  .wrap{max-width:1100px; margin:0 auto; padding:20px 18px 60px;}
  header.top{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  header.top h1{font-size:19px; margin:0; font-weight:800;}
  .status{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);}
  .dot{width:8px; height:8px; border-radius:50%; background:#9CA3AF;} .dot.on{background:var(--ok);}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .tab{padding:10px 16px; font-size:15px; font-weight:600; color:var(--sub); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit;}
  .tab.active{color:var(--ink); border-bottom-color:var(--ink);}

  .pbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .pbar button{padding:8px 16px; font-size:14px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--line); border-radius:20px; cursor:pointer; font-family:inherit;}
  .pbar button.active{color:var(--ink); border-color:var(--ink); font-weight:700;}

  .prompt{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--ink); border-radius:10px; padding:18px 20px; margin-bottom:16px;}
  .prompt .plabel{font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:6px;}
  .prompt .ptext{font-size:16px; white-space:pre-wrap;}
  .prompt .pmath{margin-top:12px;} .prompt .pmath .katex{font-size:1.3em;}
  .prompt .pimg{margin-top:14px; text-align:center;}
  .prompt .pimg img{max-width:100%; max-height:340px; border:1px solid var(--line); border-radius:8px;}

  .sketch-wrap{position:relative; width:100%; aspect-ratio:4/3; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; touch-action:none;}
  .sketch-wrap canvas{width:100%; height:100%; display:block;}
  .sketch-tools{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:24px; padding:7px 14px; box-shadow:0 4px 12px rgba(0,0,0,.1);}
  .sk-colors{display:flex; gap:8px;}
  .sk-dot{width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);} .sk-dot.active{box-shadow:0 0 0 2px var(--ink);}
  .sk-btn{font-family:inherit; font-size:14px; font-weight:600; color:var(--sub); background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px;} .sk-btn.active{color:var(--red); background:#FEF2F2;}

  .submit-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px;}
  .submit-row select, .submit-row input{padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:15px; outline:none;}
  .submit-row select:focus, .submit-row input:focus{border-color:var(--ink);}
  .btn-primary{margin-left:auto; padding:12px 26px; font-size:15px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:9px; cursor:pointer; font-family:inherit;}
  .btn-primary:disabled{opacity:.5;}
  .btn-ghost{padding:11px 16px; font-size:14px; font-weight:600; color:var(--sub); background:none; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-family:inherit;}

  .records{margin-top:28px;} .records h3{font-size:15px; margin:0 0 12px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .rec{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .rec .rtop{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:13px; font-weight:600;}
  .rec img{width:100%; display:block; border-top:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; background:#fff;}
  .rec .rbot{padding:8px 12px; font-size:12.5px; color:var(--sub);}
  .tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px;} .tag.ok{color:var(--ok); background:var(--okbg);}
  .del{font-size:12px; color:var(--red); background:none; border:none; cursor:pointer; font-family:inherit;}

  .dash-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px;}
  .dash-head h2{font-size:18px; margin:0;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filters select{padding:8px 11px; font-size:14px; border:1px solid var(--line); border-radius:8px; font-family:inherit; background:#fff;}
  .dash-section{margin-bottom:28px;}
  .dash-section-title{font-size:16px; font-weight:700; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line); display:flex; align-items:center; gap:10px;}
  .dash-section-title .cnt{font-size:13px; font-weight:600; color:var(--sub);}
  .qr-thumb{position:absolute; top:0; right:0; cursor:pointer; text-align:center;}
  .qr-thumb .cap{font-size:10px; color:var(--sub); margin-top:2px;}

  /* 출제 화면 */
  .compose{max-width:720px;}
  .compose .ci{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px;}
  .compose label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin:12px 0 6px;}
  .compose label:first-child{margin-top:0;}
  .compose input[type=text], .compose textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:15px; outline:none;}
  .compose textarea{min-height:70px; resize:vertical;}
  .compose input:focus, .compose textarea:focus{border-color:var(--ink);}
  .compose .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .compose .qhead .qn{font-size:15px; font-weight:800;}
  .compose .prev{margin-top:8px; padding:10px 12px; background:#F8F8F6; border-radius:8px; font-size:13px; color:var(--sub); min-height:20px;}
  .compose .prev .katex{font-size:1.15em;}
  .compose .imgprev{margin-top:8px;} .compose .imgprev img{max-height:120px; border:1px solid var(--line); border-radius:6px;}
  .compose-actions{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .hintbox{font-size:12.5px; color:var(--sub); background:#FEF9E7; border:1px solid #F5E6A8; border-radius:8px; padding:10px 12px; margin-bottom:14px;}

  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal.open{display:flex;}
  .modal .box{background:#fff; border-radius:12px; padding:16px; max-width:90vw; max-height:90vh; overflow:auto;}
  .modal img{max-width:100%; max-height:76vh; display:block; border-radius:8px;}
  .modal .minfo{font-size:14px; font-weight:600; margin-bottom:10px;}
  .modal .mclose{margin-top:12px; text-align:center;}

  .empty{color:var(--sub); font-size:15px; padding:20px; text-align:center;}
  @media(max-width:600px){ .btn-primary{margin-left:0; width:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="pageTitle">수업 활동</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">연결 중</span></div>
  </header>

  <!-- 교사 탭 (교사만 보임) -->
  <div class="tabs" id="teacherTabs" style="display:none;">
    <button class="tab active" id="tabCompose" onclick="showView('compose')">출제하기</button>
    <button class="tab" id="tabDash" onclick="showView('dash')">제출 현황</button>
  </div>

  <!-- ===== 학생: 문제 풀기 ===== -->
  <div id="viewSolve">
    <div id="noProblem" class="empty" style="display:none;">아직 출제된 문제가 없어요. 선생님을 기다려 주세요.</div>
    <div id="solveBody" style="display:none;">
      <div class="pbar" id="pbar"></div>
      <div class="prompt" id="prompt">
        <div class="plabel" id="pLabel"></div>
        <div class="ptext" id="pText"></div>
        <div class="pmath" id="pMath"></div>
        <div class="pimg" id="pImg"></div>
      </div>
      <div class="sketch-wrap" id="skwrap">
        <canvas id="cv"></canvas>
        <div class="sketch-tools">
          <div class="sk-colors">
            <div class="sk-dot active" style="background:#1A1A1A" onclick="setPen('#1A1A1A',this)"></div>
            <div class="sk-dot" style="background:#DC2626" onclick="setPen('#DC2626',this)"></div>
            <div class="sk-dot" style="background:#2563EB" onclick="setPen('#2563EB',this)"></div>
          </div>
          <button class="sk-btn" id="lineBtn" onclick="toggleLineMode()">직선</button>
          <button class="sk-btn" id="eraserBtn" onclick="toggleEraser()">지우개</button>
          <button class="sk-btn" onclick="clearSketch()">전체 지우기</button>
        </div>
      </div>
      <div class="submit-row">
        <select id="stuClass"><option value="">반 선택</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option></select>
        <input type="text" id="stuName" placeholder="이름" style="width:120px;">
        <button class="btn-primary" id="submitBtn" onclick="submitAnswer()">풀이 제출하기</button>
      </div>
      <div class="records" id="myRecords" style="display:none;">
        <h3>내가 제출한 풀이</h3><div class="grid" id="myGrid"></div>
      </div>
    </div>
  </div>

  <!-- ===== 교사: 출제하기 ===== -->
  <div id="viewCompose" style="display:none;">
    <div class="compose">
      <div class="hintbox">여기서 문제를 만들고 <b>“이 문제로 수업 시작”</b>을 누르면 학생 화면에 바로 나타나요. 이전에 제출된 풀이는 지워지지 않아요.</div>
      <div class="ci">
        <label>수업 제목</label>
        <input type="text" id="cTitle" placeholder="예: 5단원 삼각형의 성질" oninput="composePreview()">
      </div>
      <div id="qList"></div>
      <div class="compose-actions">
        <button class="btn-ghost" onclick="addQuestion()">+ 문제 추가</button>
        <button class="btn-primary" style="margin-left:auto;" onclick="publishProblems()">이 문제로 수업 시작</button>
      </div>
    </div>
  </div>

  <!-- ===== 교사: 제출 현황 ===== -->
  <div id="viewDash" style="display:none; position:relative;">
    <div class="qr-thumb" id="qrThumb" onclick="openModal('qrModal')" style="display:none;">
      <div id="qrSmall"></div><div class="cap">QR 크게</div>
    </div>
    <div class="dash-head">
      <h2>제출 현황</h2>
      <div class="filters">
        <select id="fClass" onchange="renderDash()"><option value="all">모든 반</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option></select>
        <select id="fProblem" onchange="renderDash()"><option value="all">모든 문제</option></select>
        <button class="btn-ghost" onclick="refreshDash()">↻ 새로고침</button>
      </div>
    </div>
    <div id="dashGrid"></div>
  </div>
</div>

<div class="modal" id="inspectModal" onclick="closeModal('inspectModal')">
  <div class="box" onclick="event.stopPropagation()">
    <div class="minfo" id="inspectInfo"></div>
    <img id="inspectImg" src="" alt="풀이">
    <div class="mclose"><button class="btn-ghost" onclick="closeModal('inspectModal')">닫기</button></div>
  </div>
</div>
<div class="modal" id="qrModal" onclick="closeModal('qrModal')">
  <div class="box" onclick="event.stopPropagation()" style="text-align:center;">
    <div class="minfo">학생 접속용 QR</div><div id="qrBig"></div>
    <div class="mclose"><button class="btn-ghost" onclick="closeModal('qrModal')">닫기</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ── 설정 (고정 — 매번 안 바꿔도 됨) ──
  const ROOM = 'gugal_class';   // 이 교실의 고정 방 이름
  const DB_PROBLEMS = 'live/'+ROOM+'/problems';   // 현재 출제된 문제
  const DB_SUBS      = 'live/'+ROOM+'/subs';       // 제출된 풀이
  const DB_META      = 'live/'+ROOM+'/meta';       // 수업 제목 등

  const isTeacher = new URLSearchParams(location.search).get('teacher')==='true';

  let database=null;
  try{ if(typeof firebase!=='undefined'){ firebase.initializeApp({ databaseURL:"https://gugal-math-default-rtdb.firebaseio.com/" }); database=firebase.database(); } }catch(e){ console.warn('Firebase 미연결',e); }

  function tex(t, inline){ if(!t) return ''; if(typeof katex!=='undefined'){ try{ return katex.renderToString(t,{throwOnError:false, displayMode:!inline}); }catch(e){ return t; } } return t; }

  // ── 상태 ──
  let problems=[];         // 현재 출제된 문제들 [{label,text,math,image}]
  let meta={title:'수업 활동'};
  let activeIdx=0;
  let strokes=[], curStroke=null, penColor='#1A1A1A', eraserOn=false, lineMode=false, dragging=false;
  const recCache={};

  let cv,ctx,skwrap;

  window.onload=()=>{
    cv=document.getElementById('cv'); ctx=cv.getContext('2d'); skwrap=document.getElementById('skwrap');
    if(isTeacher){ setupTeacher(); } else { setupStudent(); }
  };
  window.addEventListener('resize', ()=>{ if(skwrap && skwrap.offsetParent!==null) resize(); });
  function resize(){ if(!cv) return; cv.width=skwrap.clientWidth; cv.height=skwrap.clientHeight; draw(); }

  // ════════════ 공통: 문제 표시 ════════════
  function applyMeta(){ document.getElementById('pageTitle').textContent=meta.title||'수업 활동'; document.title=meta.title||'수업 활동'; }

  function renderProblemBar(){
    const bar=document.getElementById('pbar'); bar.innerHTML='';
    problems.forEach((p,i)=>{ const b=document.createElement('button'); b.textContent=p.label||('문제 '+(i+1)); b.id='pb_'+i; b.onclick=()=>selectProblem(i); bar.appendChild(b); });
    const fp=document.getElementById('fProblem'); if(fp){ fp.innerHTML='<option value="all">모든 문제</option>'; problems.forEach((p,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=p.label||('문제 '+(i+1)); fp.appendChild(o); }); }
  }
  function selectProblem(i){
    activeIdx=i;
    document.querySelectorAll('#pbar button').forEach(b=>b.classList.remove('active'));
    const btn=document.getElementById('pb_'+i); if(btn) btn.classList.add('active');
    const p=problems[i]||{};
    document.getElementById('pLabel').textContent=p.label||('문제 '+(i+1));
    document.getElementById('pText').textContent=p.text||'';
    document.getElementById('pMath').innerHTML=p.math?tex(p.math,false):'';
    document.getElementById('pImg').innerHTML=p.image?`<img src="${p.image}" alt="문제 그림">`:'';
    strokes=[]; curStroke=null; draw();
  }

  // ════════════ 스케치북 ════════════
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.lineCap='round'; ctx.lineJoin='round';
    const all=curStroke?strokes.concat([curStroke]):strokes;
    all.forEach(s=>{ if(!s.pts.length) return; ctx.strokeStyle=s.color; ctx.lineWidth=s.width; ctx.beginPath(); ctx.moveTo(s.pts[0].x,s.pts[0].y); for(let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x,s.pts[i].y); ctx.stroke(); });
  }
  function pos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function startDraw(e){ dragging=true; const p=pos(e); curStroke={color:eraserOn?'#ffffff':penColor, width:eraserOn?18:2.5, pts: lineMode?[p,p]:[p]}; draw(); }
  function moveDraw(e){ if(!dragging||!curStroke) return; const p=pos(e); if(lineMode){ curStroke.pts[1]=p; } else { curStroke.pts.push(p); } draw(); }
  function endDraw(){ if(curStroke){ if(curStroke.pts.length) strokes.push(curStroke); curStroke=null; draw(); } dragging=false; }
  function bindCanvas(){
    cv.addEventListener('mousedown',startDraw); cv.addEventListener('mousemove',moveDraw); window.addEventListener('mouseup',endDraw);
    cv.addEventListener('touchstart',e=>{e.preventDefault();startDraw(e);},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault();moveDraw(e);},{passive:false});
    cv.addEventListener('touchend',e=>{e.preventDefault();endDraw();},{passive:false});
  }
  function setPen(c,el){ penColor=c; eraserOn=false; document.querySelectorAll('.sk-dot').forEach(d=>d.classList.remove('active')); if(el) el.classList.add('active'); document.getElementById('eraserBtn').classList.remove('active'); }
  function toggleEraser(){ eraserOn=!eraserOn; if(eraserOn){ lineMode=false; document.getElementById('lineBtn').classList.remove('active'); } document.getElementById('eraserBtn').classList.toggle('active', eraserOn); }
  function toggleLineMode(){ lineMode=!lineMode; if(lineMode){ eraserOn=false; document.getElementById('eraserBtn').classList.remove('active'); } document.getElementById('lineBtn').classList.toggle('active', lineMode); }
  function clearSketch(){ if(strokes.length && !confirm('필기한 내용을 모두 지울까요?')) return; strokes=[]; curStroke=null; draw(); }

  // ════════════ 학생 ════════════
  function setupStudent(){
    bindCanvas(); resize();
    if(database){
      database.ref('.info/connected').on('value',s=>{ const on=s.val(); document.getElementById('dot').classList.toggle('on',on); document.getElementById('statusTxt').textContent=on?'연결됨':'오프라인'; });
      // 문제 실시간 수신
      database.ref(DB_META).on('value', s=>{ meta=s.val()||{title:'수업 활동'}; applyMeta(); });
      database.ref(DB_PROBLEMS).on('value', s=>{
        const v=s.val();
        problems = v ? (Array.isArray(v)?v:Object.values(v)) : [];
        if(problems.length){
          document.getElementById('noProblem').style.display='none';
          document.getElementById('solveBody').style.display='block';
          renderProblemBar(); selectProblem(0); resize();
        } else {
          document.getElementById('noProblem').style.display='block';
          document.getElementById('solveBody').style.display='none';
        }
      });
      // 내 제출 수신
      database.ref(DB_SUBS).on('value', snap=>{ const keys=myKeys(), mine=[]; snap.forEach(c=>{ if(keys.includes(c.key)) mine.push({id:c.key, ...c.val()}); }); mine.sort((a,b)=>b.time-a.time); renderMy(mine); });
    }
  }
  function myKeys(){ const k=localStorage.getItem('sub_'+ROOM); return k?JSON.parse(k):[]; }
  function saveKey(k){ const a=myKeys(); if(!a.includes(k)){ a.push(k); localStorage.setItem('sub_'+ROOM, JSON.stringify(a)); } }

  function submitAnswer(){
    if(!database){ alert('인터넷 연결이 필요해요.'); return; }
    const cls=document.getElementById('stuClass').value, name=document.getElementById('stuName').value.trim();
    if(!cls||!name){ alert('반과 이름을 입력해 주세요.'); return; }
    if(strokes.length<1){ alert('노트에 풀이를 적어 주세요.'); return; }
    const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='전송 중...';
    const img=cv.toDataURL('image/png');
    const ref=database.ref(DB_SUBS).push(); saveKey(ref.key);
    ref.set({ class:cls, name:name, pIdx:activeIdx, label:(problems[activeIdx].label||('문제 '+(activeIdx+1))), img:img, time:Date.now() })
      .then(()=>{ alert('제출되었습니다!'); btn.disabled=false; btn.textContent='풀이 제출하기'; })
      .catch(()=>{ alert('전송 실패. 다시 시도해 주세요.'); btn.disabled=false; btn.textContent='풀이 제출하기'; });
  }
  function renderMy(data){
    const wrap=document.getElementById('myRecords'), g=document.getElementById('myGrid');
    if(!data.length){ wrap.style.display='none'; return; }
    wrap.style.display='block'; g.innerHTML='';
    data.forEach(d=>{ recCache[d.id]=d; const t=new Date(d.time), ts=`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
      const el=document.createElement('div'); el.className='rec';
      el.innerHTML=`<div class="rtop"><span>${d.label}</span><span class="tag ok">제출됨</span></div><img src="${d.img}" onclick="openInspect('${d.id}')"><div class="rbot">${ts} 제출</div>`;
      g.appendChild(el); });
  }

  // ════════════ 교사 ════════════
  function setupTeacher(){
    document.getElementById('teacherTabs').style.display='flex';
    document.getElementById('viewSolve').style.display='none';
    document.getElementById('viewCompose').style.display='block';
    document.getElementById('statusTxt').textContent='교사 모드';
    // QR
    const url=location.origin+location.pathname;
    if(typeof QRCode!=='undefined'){ new QRCode(document.getElementById('qrSmall'),{text:url,width:38,height:38,colorDark:'#1A1A1A'}); new QRCode(document.getElementById('qrBig'),{text:url,width:260,height:260,colorDark:'#1A1A1A'}); document.getElementById('qrThumb').style.display='block'; }
    if(database){
      database.ref('.info/connected').on('value',s=>{ const on=s.val(); document.getElementById('dot').classList.toggle('on',on); document.getElementById('statusTxt').textContent=on?'교사 모드':'오프라인'; });
      // 기존 출제된 문제 불러와 편집칸 채우기
      database.ref(DB_META).once('value').then(s=>{ const m=s.val(); if(m&&m.title) document.getElementById('cTitle').value=m.title; });
      database.ref(DB_PROBLEMS).once('value').then(s=>{ const v=s.val(); const arr=v?(Array.isArray(v)?v:Object.values(v)):[]; composeState = arr.length?arr.map(p=>({...p})):[blankQ()]; renderCompose(); });
      // 제출 실시간
      database.ref(DB_SUBS).on('value', snap=>{ window.allData=[]; snap.forEach(c=>{ window.allData.push({id:c.key, ...c.val()}); }); window.allData.sort((a,b)=>b.time-a.time); if(currentView==='dash') renderDash(); }, err=>console.warn(err));
    } else { composeState=[blankQ()]; renderCompose(); }
  }

  let currentView='compose';
  function showView(v){
    currentView=v;
    document.getElementById('tabCompose').classList.toggle('active', v==='compose');
    document.getElementById('tabDash').classList.toggle('active', v==='dash');
    document.getElementById('viewCompose').style.display = v==='compose'?'block':'none';
    document.getElementById('viewDash').style.display = v==='dash'?'block':'none';
    if(v==='dash'){ renderProblemBar(); renderDash(); }
  }

  // ── 출제 편집 상태 ──
  let composeState=[];
  function blankQ(){ return {label:'', text:'', math:'', image:''}; }
  function addQuestion(){ composeState.push(blankQ()); renderCompose(); }
  function removeQuestion(i){ composeState.splice(i,1); if(!composeState.length) composeState=[blankQ()]; renderCompose(); }

  function renderCompose(){
    const list=document.getElementById('qList'); list.innerHTML='';
    composeState.forEach((q,i)=>{
      const div=document.createElement('div'); div.className='ci';
      div.innerHTML=`
        <div class="qhead"><span class="qn">문제 ${i+1}</span>${composeState.length>1?`<button class="del" onclick="removeQuestion(${i})">삭제</button>`:''}</div>
        <label>문제 이름 (버튼에 표시)</label>
        <input type="text" data-k="label" data-i="${i}" value="${escAttr(q.label)}" placeholder="예: 문제 1">
        <label>문제 설명</label>
        <textarea data-k="text" data-i="${i}" placeholder="문제 내용을 적어요">${escHtml(q.text)}</textarea>
        <label>수식 (선택 — KaTeX 문법, 없으면 비움)</label>
        <input type="text" data-k="math" data-i="${i}" value="${escAttr(q.math)}" placeholder="예: \\angle B = 70^\\circ">
        <div class="prev" id="prev_${i}"></div>
        <label>도형 그림 (선택 — 파일 선택하면 자동 업로드)</label>
        <input type="file" accept="image/*" onchange="pickImage(event,${i})">
        <div class="imgprev" id="imgprev_${i}">${q.image?`<img src="${q.image}">`:''}</div>
      `;
      list.appendChild(div);
    });
    // 입력 이벤트 연결
    list.querySelectorAll('[data-k]').forEach(el=>{
      el.addEventListener('input', e=>{ const i=+e.target.dataset.i, k=e.target.dataset.k; composeState[i][k]=e.target.value; if(k==='math') updatePrev(i); });
    });
    composeState.forEach((q,i)=>updatePrev(i));
  }
  function updatePrev(i){ const el=document.getElementById('prev_'+i); if(!el) return; const m=composeState[i].math; el.innerHTML = m ? ('미리보기: '+tex(m,true)) : '수식 미리보기'; }
  function composePreview(){ meta.title=document.getElementById('cTitle').value; }

  function pickImage(ev, i){
    const f=ev.target.files[0]; if(!f) return;
    if(f.size>1200000){ alert('그림이 너무 커요(1MB 이하 권장). 더 작은 그림을 써주세요.'); }
    const reader=new FileReader();
    reader.onload=()=>{ composeState[i].image=reader.result; document.getElementById('imgprev_'+i).innerHTML=`<img src="${reader.result}">`; };
    reader.readAsDataURL(f);
  }

  function publishProblems(){
    if(!database){ alert('인터넷 연결이 필요해요.'); return; }
    const title=document.getElementById('cTitle').value.trim()||'수업 활동';
    const clean=composeState.filter(q=>(q.text&&q.text.trim())||q.image).map((q,idx)=>({ label:(q.label&&q.label.trim())||('문제 '+(idx+1)), text:q.text||'', math:q.math||'', image:q.image||'' }));
    if(!clean.length){ alert('문제를 하나 이상 입력해 주세요.'); return; }
    Promise.all([ database.ref(DB_META).set({title:title}), database.ref(DB_PROBLEMS).set(clean) ])
      .then(()=>alert('수업이 시작됐어요! 학생 화면에 문제가 나타납니다.'))
      .catch(()=>alert('저장 실패. 다시 시도해 주세요.'));
  }

  // ── 대시보드 ──
  function refreshDash(){ if(!database) return; database.ref(DB_SUBS).once('value').then(snap=>{ window.allData=[]; snap.forEach(c=>{ window.allData.push({id:c.key, ...c.val()}); }); window.allData.sort((a,b)=>b.time-a.time); renderDash(); }); }
  function renderDash(){
    const cf=document.getElementById('fClass').value, pf=document.getElementById('fProblem').value, g=document.getElementById('dashGrid');
    const data=(window.allData||[]).filter(d=>(cf==='all'||d.class===cf)&&(pf==='all'||String(d.pIdx)===pf));
    if(!data.length){ g.innerHTML='<p class="empty">아직 제출된 풀이가 없습니다.</p>'; return; }
    const groups={}; data.forEach(d=>{ (groups[d.pIdx]=groups[d.pIdx]||[]).push(d); });
    g.innerHTML='';
    Object.keys(groups).sort((a,b)=>a-b).forEach(pi=>{
      const items=groups[pi]; const label=items[0].label||('문제 '+(Number(pi)+1));
      const sec=document.createElement('div'); sec.className='dash-section';
      sec.innerHTML=`<div class="dash-section-title">${label} <span class="cnt">${items.length}명 제출</span></div>`;
      const grid=document.createElement('div'); grid.className='grid';
      items.forEach(d=>{ recCache[d.id]=d; const t=new Date(d.time), ts=`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
        const el=document.createElement('div'); el.className='rec';
        el.innerHTML=`<div class="rtop"><span>${d.class}반 ${d.name}</span><button class="del" onclick="delRec('${d.id}')">삭제</button></div><img src="${d.img}" onclick="openInspect('${d.id}')"><div class="rbot">${ts} 제출</div>`;
        grid.appendChild(el); });
      sec.appendChild(grid); g.appendChild(sec);
    });
  }
  function delRec(id){ if(database && confirm('이 제출을 삭제할까요?')) database.ref(DB_SUBS+'/'+id).remove(); }

  // ── 모달 & 유틸 ──
  function openInspect(id){ const d=recCache[id]; if(!d) return; document.getElementById('inspectImg').src=d.img; document.getElementById('inspectInfo').textContent = isTeacher?`${d.class}반 ${d.name} · ${d.label}`:d.label; openModal('inspectModal'); }
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }
  function escAttr(s){ return (s||'').replace(/\\/g,'\\\\').replace(/"/g,'&quot;'); }
  function escHtml(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>

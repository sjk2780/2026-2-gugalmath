  input:focus::placeholder{ color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif; line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:20px 18px 60px;}
  header.top{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  header.top h1{font-size:19px; margin:0; font-weight:800;}
  .status{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);}
  .dot{width:8px; height:8px; border-radius:50%; background:#9CA3AF;}
  .dot.on{background:var(--ok);}

  /* 탭 */
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{padding:10px 18px; font-size:15px; font-weight:600; color:var(--sub); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit;}
  .tab.active{color:var(--ink); border-bottom-color:var(--ink);}

  /* 문제 선택 바 */
  .pbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .pbar button{padding:8px 16px; font-size:14px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--line); border-radius:20px; cursor:pointer; font-family:inherit;}
  .pbar button.active{color:var(--ink); border-color:var(--ink); font-weight:700;}

  /* 문제 카드 */
  .prompt{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--ink); border-radius:10px; padding:16px 18px; margin-bottom:14px;}
  .prompt .plabel{font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:6px;}
  .prompt .ptext{font-size:16px; white-space:pre-wrap;}
  .prompt .pmath{margin-top:10px;}
  .prompt .pmath .katex{font-size:1.3em;}

  /* 캔버스 공통 */
  .sketch-wrap{position:relative; width:100%; aspect-ratio:4/3; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; touch-action:none;}
  .sketch-wrap canvas{width:100%; height:100%; display:block;}
  .sketch-tools{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:24px; padding:7px 14px; box-shadow:0 4px 12px rgba(0,0,0,.1); flex-wrap:wrap; justify-content:center; max-width:94%;}
  .sk-colors{display:flex; gap:8px;}
  .sk-dot{width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .sk-dot.active{box-shadow:0 0 0 2px var(--ink);}
  .sk-btn{font-family:inherit; font-size:14px; font-weight:600; color:var(--sub); background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px; white-space:nowrap;}
  .sk-btn.active{color:var(--red); background:#FEF2F2;}
  .sk-sep{width:1px; height:18px; background:var(--line); display:block;}

  /* 탐구 패널 */
  .exhead{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:14px 18px; margin-bottom:14px;}
  .exhead .extitle{font-size:16px; font-weight:700; margin-bottom:4px;}
  .exhead .exsub{font-size:14px; color:var(--sub); white-space:pre-wrap;}
  .extools{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;}
  .chip{padding:8px 14px; font-size:14px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--line); border-radius:20px; cursor:pointer; font-family:inherit;}
  .chip.on{color:#fff; background:var(--accent); border-color:var(--accent);}
  .chip.plain.on{color:var(--ink); background:#F0FDFA; border-color:var(--accent);}
  .readout{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .rd{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 14px; font-size:14px; min-width:104px;}
  .rd .k{font-size:11.5px; color:var(--sub); font-weight:700; display:block; letter-spacing:.02em;}
  .rd .v{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
  .rd.eq{border-color:var(--accent); background:#F0FDFA;}
  .exnote{margin-top:12px; font-size:14px; color:var(--ok); background:var(--okbg); border:1px solid #A7F3D0; border-radius:9px; padding:10px 14px; display:none;}
  .exnote.show{display:block;}

  /* 증명 보기 — 교실 앞에서 띄우므로 글씨를 크게 */
  .pfnum{font-size:14px; font-weight:800; color:var(--blue); letter-spacing:.04em; margin-bottom:8px;}
  /* TV로 학생이 보는 화면 — 스크롤 없이 한 화면에 도형+증명이 다 들어와야 한다 */
  .pfmain{display:grid; grid-template-columns:1.32fr 1fr; gap:16px; align-items:stretch;
          height:calc(100vh - 286px); min-height:340px;}
  /* 증명 화면일 때는 TV 화면을 꽉 쓰고, 세로 스크롤이 생기지 않게 여백을 줄인다 */
  body.proofmode .wrap{max-width:1720px; padding-bottom:14px;}
  body.proofmode header.top{margin-bottom:10px;}
  body.proofmode .tabs{margin-bottom:12px;}
  /* 다음을 누를 때마다 증명 과정이 오른쪽에 쌓인다 */
  /* 글자 크기(--pfFs)는 화면 높이에 맞춰 JS가 자동으로 줄인다 (pfFitLog) */
  .pflog{--pfFs:20px; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--blue);
         border-radius:10px; padding:4px 20px; height:100%; overflow-y:auto;}
  .pflog .item{display:flex; gap:12px; align-items:flex-start; border-bottom:1px dashed var(--line);
               font-size:var(--pfFs); padding:calc(var(--pfFs)*0.55) 0; line-height:1.5;
               white-space:pre-wrap; color:var(--sub);}
  .pflog .item:last-child{border-bottom:none;}
  .pflog .item.cur{color:var(--ink); font-weight:600;}
  .pflog .n{flex:none; min-width:22px; font-size:calc(var(--pfFs)*0.7); font-weight:800; color:var(--blue); padding-top:4px;}
  @media(max-width:760px){ .pfmain{grid-template-columns:1fr; height:auto;} #pfwrap{aspect-ratio:16/9;} }
  /* ★ 기본값: 단계 글 패널을 숨기고 캔버스가 화면 전체를 쓴다.
     교사가 아이패드 펜으로 직접 증명을 써 내려가므로, 오른쪽은 그 필기 공간이다.
     (도형은 캔버스 왼쪽 pfFW 폭 안에만 그린다 — JS의 pfFW 참고) */
  .pfmain.nolog{grid-template-columns:1fr;}
  .pfmain.nolog .pflog{display:none;}
  /* 필기 공간 가운데를 도구막대가 가리지 않도록 왼쪽(도형 쪽)으로 붙인다 */
  .pfmain.nolog .sketch-tools{left:14px; transform:none; max-width:calc(100% - 28px);}
  /* 증명 캔버스는 왼쪽 칸을 꽉 채운다(높이는 .pfmain이 결정) */
  #pfwrap{aspect-ratio:auto; height:100%;}
  .pfnav{display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .pfdots{display:flex; gap:6px; margin:0 4px;}
  .pfdots i{width:9px; height:9px; border-radius:50%; background:var(--line); display:block;}
  .pfdots i.on{background:var(--blue);}
  @media(max-width:600px){ .pflog .item{font-size:17px;} }

  /* 제출 영역 */
  .submit-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px;}
  .submit-row select, .submit-row input{padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:15px; outline:none;}
  .submit-row select:focus, .submit-row input:focus{border-color:var(--ink);}
  .btn-primary{margin-left:auto; padding:12px 26px; font-size:15px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:9px; cursor:pointer; font-family:inherit;}
  .btn-primary:disabled{opacity:.5;}
  .btn-ghost{padding:11px 16px; font-size:14px; font-weight:600; color:var(--sub); background:none; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-family:inherit;}

  /* 내 제출 */
  .records{margin-top:28px;}
  .records h3{font-size:15px; margin:0 0 12px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .rec{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .rec .rtop{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:13px; font-weight:600;}
  .rec img{width:100%; display:block; border-top:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; background:#fff;}
  .rec .rbot{padding:8px 12px; font-size:12.5px; color:var(--sub);}
  .tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px;}
  .tag.ok{color:var(--ok); background:var(--okbg);}
  .del{font-size:12px; color:var(--red); background:none; border:none; cursor:pointer; font-family:inherit;}

  /* 교사 대시보드 */
  .dash-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px;}
  .dash-head h2{font-size:18px; margin:0;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filters select{padding:8px 11px; font-size:14px; border:1px solid var(--line); border-radius:8px; font-family:inherit; background:#fff;}
  .dash-section{margin-bottom:28px;}
  .dash-section-title{font-size:16px; font-weight:700; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line); display:flex; align-items:center; gap:10px;}
  .dash-section-title .cnt{font-size:13px; font-weight:600; color:var(--sub);}
  .qr-thumb{position:absolute; top:16px; right:16px; cursor:pointer; text-align:center;}
  .qr-thumb .cap{font-size:10px; color:var(--sub); margin-top:2px;}

  /* 모달 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal.open{display:flex;}
  .modal .box{background:#fff; border-radius:12px; padding:16px; max-width:90vw; max-height:90vh; overflow:auto;}
  .modal img{max-width:100%; max-height:76vh; display:block; border-radius:8px;}
  .modal .minfo{font-size:14px; font-weight:600; margin-bottom:10px;}
  .modal .mclose{margin-top:12px; text-align:center;}

  @media(max-width:600px){
    .prompt .ptext{font-size:15px;}
    .btn-primary{margin-left:0; width:100%;}
    .submit-row{gap:8px;}
    .sk-btn{font-size:13px; padding:4px 6px;}
    .rd{min-width:92px; padding:8px 11px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="pageTitle">수업 활동</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">연결 중</span></div>

  <!-- 학생 탭 -->
  <div class="tabs" id="studentTabs">
    <button class="tab active" id="tabExplore" onclick="showView('explore')">탐구하기</button>
    <button class="tab" id="tabProof" onclick="showView('proof')" style="display:none;">증명 보기</button><button class="tab" id="tabSolve" onclick="showView('solve')">문제 풀기</button><button class="tab" id="tabDash" onclick="showView('dash')" style="display:none;">제출 현황</button>

  <!-- ===== 학생: 탐구하기 ===== -->
  <div id="viewExplore">
    <div class="exhead">
      <div class="extitle" id="exTitle"></div>
      <div class="exsub" id="exSub"></div>
    </div>

    <div class="extools" id="exTools"></div>

    <div class="sketch-wrap" id="exwrap">

    <div class="submit-row">
      <select id="exClass">

        <option value="1">1반</option><option value="2">2반</option><option value="3">3반</option>
        <option value="4">4반</option><option value="5">5반</option><option value="6">6반</option>
        <option value="7">7반</option><option value="8">8반</option>

    <div class="pfnum" id="pfNum"></div>

    <!-- TV 화면 기준: 왼쪽 도형 / 오른쪽 증명 과정 (스크롤 없이 한 화면) -->
    <div class="pfmain nolog" id="pfMain">
      <div class="sketch-wrap" id="pfwrap">

        <div class="sketch-tools" id="pfTools">

            <div class="sk-dot" style="background:#2563EB" onclick="pfSetPen('#2563EB',this)"></div>

          <button class="sk-btn" id="pfEraserBtn" onclick="pfToggleEraser()">지우개</button>

    <div class="pfnav">

<script>
  const isTeacher = new URLSearchParams(location.search).get('teacher')==='true';
  const DB_PATH = 'classroom/' + CONFIG.folder;
  const EXPLORE_IDX = -1;               // 탐구 제출을 구분하는 pIdx
  const CANVAS_CM  = 12;                // 탐구 캔버스 가로를 12cm로 간주(화면 크기와 무관하게 일정)

  let database=null;
  try{
    if(typeof firebase!=='undefined'){
      firebase.initializeApp({ databaseURL:"https://gugal-math-default-rtdb.firebaseio.com/" });
      database=firebase.database();
    }
  }catch(e){ console.warn('Firebase 미연결', e); }

  function tex(t, inline){
    if(!t) return '';
    if(typeof katex!=='undefined'){
      try{ return katex.renderToString(t,{throwOnError:false, displayMode:!inline}); }catch(e){ return t; }
    }
    return t;
  }

  /* ══════════════ 기하 계산 도우미 ══════════════ */
  function dist(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }
  function mid(p,q){ return {x:(p.x+q.x)/2, y:(p.y+q.y)/2}; }
  function sub(p,q){ return {x:p.x-q.x, y:p.y-q.y}; }
  function add(p,q){ return {x:p.x+q.x, y:p.y+q.y}; }
  function mul(v,s){ return {x:v.x*s, y:v.y*s}; }
  function norm(v){ const L=Math.hypot(v.x,v.y)||1; return {x:v.x/L, y:v.y/L}; }
  function perp(v){ return {x:-v.y, y:v.x}; }
  function cm(px){ const s=(exW||600)/CANVAS_CM; return (px/s).toFixed(1); }

  // 점 P에서 두 점 X, Y를 바라본 각(도)
  function angleAt(P,X,Y){
    const a1=Math.atan2(X.y-P.y, X.x-P.x), a2=Math.atan2(Y.y-P.y, Y.x-P.x);
    let t=Math.abs(a1-a2);
    if(t>Math.PI) t=2*Math.PI-t;
    return t*180/Math.PI;
  }
  // 외심
  function circumcenter(A,B,C){
    const d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));
    if(Math.abs(d)<1e-9) return null;
    const A2=A.x*A.x+A.y*A.y, B2=B.x*B.x+B.y*B.y, C2=C.x*C.x+C.y*C.y;
    return {
      x:(A2*(B.y-C.y)+B2*(C.y-A.y)+C2*(A.y-B.y))/d,
      y:(A2*(C.x-B.x)+B2*(A.x-C.x)+C2*(B.x-A.x))/d
    };
  }
  // 내심
  function incenter(A,B,C){
    const a=dist(B,C), b=dist(C,A), c=dist(A,B), s=a+b+c;
    if(s<1e-9) return null;
    return {x:(a*A.x+b*B.x+c*C.x)/s, y:(a*A.y+b*B.y+c*C.y)/s};
  }
  // 점 P에서 직선 XY에 내린 수선의 발
  function footPerp(P,X,Y){
    const v=sub(Y,X), L2=v.x*v.x+v.y*v.y;
    if(L2<1e-9) return {x:X.x,y:X.y};
    const t=((P.x-X.x)*v.x+(P.y-X.y)*v.y)/L2;
    return {x:X.x+t*v.x, y:X.y+t*v.y};
  }
  // 삼각형이 너무 납작한가(거의 일직선) — 탐구가 깨지지 않도록 막는 용도
  function tooFlat(A,B,C){
    if(!A||!B||!C) return true;
    const m=Math.max(angleAt(A,B,C), angleAt(B,A,C), angleAt(C,A,B));
    return m>165;
  }
  // 점 P가 삼각형 ABC 내부에 있는가
  function inTriangle(P,A,B,C){
    const s=(p,q,r)=>(p.x-r.x)*(q.y-r.y)-(q.x-r.x)*(p.y-r.y);
    const d1=s(P,A,B), d2=s(P,B,C), d3=s(P,C,A);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    return !(neg&&pos);
  }
  // 삼각형의 종류 + 외심/내심 위치 설명
  function triKind(A,B,C){
    const m=Math.max(angleAt(A,B,C), angleAt(B,A,C), angleAt(C,A,B));
    if(Math.abs(m-90)<1.2) return {kind:'직각삼각형', pos:'빗변의 중점'};
    if(m>90) return {kind:'둔각삼각형', pos:'삼각형의 외부'};
    return {kind:'예각삼각형', pos:'삼각형의 내부'};
  }
  // 두 직선(점+방향)의 교점
  function lineX(P,dP,Q,dQ){
    const den=dP.x*dQ.y-dP.y*dQ.x;
    if(Math.abs(den)<1e-9) return null;
    const t=((Q.x-P.x)*dQ.y-(Q.y-P.y)*dQ.x)/den;
    return {x:P.x+t*dP.x, y:P.y+t*dP.y};
  }

  /* ══════════════ 탐구 모드 정의 ══════════════ */
  const EX_DEFS = {
    isosceles: {
      title: '이등변삼각형을 살펴봅시다',
      sub: '꼭짓점 A, B, C를 손가락으로 끌어 삼각형을 바꿔 보세요.',
      tools: [
        {k:'lock',  label:'AB=AC 고정'},
        {k:'bisec', label:'꼭지각 A의 이등분선'}
      ]
    },
    congruence: {
      title: '두 직각삼각형을 포개 봅시다',
      sub: '오른쪽 삼각형을 끌고, 회전·뒤집기로 왼쪽 삼각형에 포개어 보세요.',
      tools: [
        {k:'rha', label:'빗변 + 한 예각', group:'preset'},
        {k:'rhs', label:'빗변 + 다른 한 변', group:'preset'},
        {k:'rotL', label:'↺ 회전', action:true},
        {k:'rotR', label:'↻ 회전', action:true},
        {k:'flip', label:'뒤집기', action:true}
      ]
    },
    circumcenter: {
      title: '세 변의 수직이등분선을 그어 봅시다',
      sub: '아래 버튼으로 수직이등분선을 하나씩 그어 보고, 꼭짓점을 끌어 삼각형을 바꿔 보세요.',
      tools: [
        {k:'pa', label:'변 BC의 수직이등분선'},
        {k:'pb', label:'변 CA의 수직이등분선'},
        {k:'pc', label:'변 AB의 수직이등분선'},
        {k:'circle', label:'점 O를 중심으로 하는 원'}
      ]
    },
    incenter: {
      title: '세 내각의 이등분선을 그어 봅시다',
      sub: '아래 버튼으로 각의 이등분선을 하나씩 그어 보고, 꼭짓점을 끌어 삼각형을 바꿔 보세요.',
      tools: [
        {k:'ba', label:'∠A의 이등분선'},
        {k:'bb', label:'∠B의 이등분선'},
        {k:'bc', label:'∠C의 이등분선'},
        {k:'circle', label:'점 I를 중심으로 하는 원'}
      ]
    },
    parallelogram: {
      title: '어떤 사각형이 평행사변형이 될까요?',
      sub: '네 꼭짓점 A, B, C, D를 끌어 사각형을 바꿔 보세요.',
      tools: [
        {k:'sides',  label:'대변의 길이'},
        {k:'angles', label:'대각의 크기'},
        {k:'diags',  label:'두 대각선'},
        {k:'lock',   label:'평행사변형으로 고정'}
      ]
    },
    quadkinds: {
      title: '여러 가지 사각형을 만들어 봅시다',
      sub: '점 A와 점 C를 끌어 보세요. (평행사변형은 항상 유지됩니다)',
      tools: [
        {k:'sides', label:'네 변의 길이'},
        {k:'diags', label:'두 대각선'},
        {k:'right', label:'직각 표시'}
      ]
    }
  };
  // 사각형 탐구 모드인가
  function isQuadMode(){ return CONFIG.explore==='parallelogram' || CONFIG.explore==='quadkinds'; }

  const exMode = CONFIG.explore;
  const exDef  = EX_DEFS[exMode] || EX_DEFS.isosceles;

  let ex = {
    A:null, B:null, C:null,
    drag:null,
    opts:{},
    preset:'rha',
    t2:{dx:0, dy:0, rot:0, flip:1},   // 5.2용 두 번째 삼각형 변환
    lockLen:null
  };

  let exCv, exCtx, exWrap, exW=0, exH=0;

  function exInitPoints(){
    if(isQuadMode()){ exQuadInit(); return; }
    ex.A={x:exW*0.50, y:exH*0.16};
    ex.B={x:exW*0.22, y:exH*0.80};
    ex.C={x:exW*0.78, y:exH*0.80};
    ex.lockLen=dist(ex.A,ex.B);
    ex.t2=exT2Start();
  }
  // 두 번째 삼각형의 시작 위치(E가 놓이는 자리) — 화면 안에 완전히 들어오도록
  function exT2Start(){ return {dx:exW*0.56, dy:exH*0.72, rot:0, flip:1}; }
  function exReset(){ exInitPoints(); exDraw(); exUpdate(); }

  /* ══════════════ 사각형 탐구 (6.2 / 6.3) ══════════════
     □ABCD 는 A(왼쪽 위) → B(왼쪽 아래) → C(오른쪽 아래) → D(오른쪽 위) 순.
     대변 쌍: AB↔DC, BC↔AD.  평행사변형 ⟺ D = A + C − B */
  function exQuadInit(){
    if(CONFIG.explore==='quadkinds'){
      ex.A={x:exW*0.30, y:exH*0.26};
      ex.B={x:exW*0.24, y:exH*0.78};
      ex.C={x:exW*0.70, y:exH*0.78};
      ex.D=add(sub(ex.A,ex.B), ex.C);           // 항상 평행사변형
    } else {
      // 일부러 평행사변형이 아닌 상태로 시작(학생이 직접 만들어 보도록)
      ex.A={x:exW*0.32, y:exH*0.24};
      ex.B={x:exW*0.20, y:exH*0.80};
      ex.C={x:exW*0.72, y:exH*0.80};
      ex.D={x:exW*0.80, y:exH*0.32};
    }
  }
  // 표시 단위(0.1cm)에 해당하는 픽셀 허용오차
  function exTolPx(){ return 0.1*((exW||600)/CANVAS_CM); }
  const EX_ANG_TOL = 1.5;                        // 직각 스냅 허용오차(도)

  function exIsPara(){
    const ideal=add(sub(ex.A,ex.B), ex.C);
    return dist(ideal, ex.D) < 0.5;
  }
  // 끌고 있는 점을 평행사변형이 되는 위치로 붙인다(거의 평행사변형일 때만)
  function exSnapPara(k){
    const {A,B,C,D}=ex;
    let ideal;
    if(k==='D') ideal=add(sub(A,B), C);
    else if(k==='A') ideal=add(sub(D,C), B);
    else if(k==='B') ideal=add(sub(A,D), C);
    else            ideal=add(sub(D,A), B);      // 'C'
    if(dist(ideal, ex[k]) < exTolPx()*2) ex[k]={x:ideal.x, y:ideal.y};
  }
  // 6.3: B를 기준으로 끌고 있는 점을 직각/같은 길이에 붙인다
  function exSnapKind(k){
    const B=ex.B;
    const moved = (k==='A') ? 'A' : 'C';
    const other = (k==='A') ? 'C' : 'A';
    const vo = sub(ex[other], B), vm = sub(ex[moved], B);
    const Lo = Math.hypot(vo.x,vo.y), Lm = Math.hypot(vm.x,vm.y);
    if(Lo<1 || Lm<1) return;
    let ang = Math.atan2(vm.y,vm.x), len = Lm;
    // ① 두 변의 길이가 "화면에 같게 보이면" 정확히 같게 (마름모)
    if(Math.abs(Lm-Lo) < exTolPx()) len = Lo;
    // ② 두 대각선이 "화면에 같게 보이면" 정확히 직각으로 (직사각형)
    //    ★ 고정 각도로 판단하면 안 된다. 도형이 작을 때 각도는 벌어졌는데
    //      대각선 길이는 표시 단위 안에서 같아 보여 "대각선은 같은데 직사각형이
    //      아니다"라는 모순이 생긴다(5.1에서 겪은 것과 같은 함정).
    const base = Math.atan2(vo.y,vo.x);
    let diff = (ang-base)*180/Math.PI;
    while(diff>180) diff-=360; while(diff<-180) diff+=360;
    const sign = diff>=0 ? 1 : -1;
    const cand = { x:B.x+Math.cos(ang)*len, y:B.y+Math.sin(ang)*len };
    const A2 = (moved==='A') ? cand : ex.A;
    const C2 = (moved==='C') ? cand : ex.C;
    const D2 = add(sub(A2,B), C2);
    if(Math.abs(dist(A2,C2) - dist(B,D2)) < exTolPx()) ang = base + sign*Math.PI/2;
    ex[moved] = { x:B.x+Math.cos(ang)*len, y:B.y+Math.sin(ang)*len };
  }
  // 사각형의 종류 판정 (스냅 덕분에 표시와 항상 일치한다)
  function exQuadKind(){
    const {A,B,C,D}=ex;
    const para = exIsPara();
    if(!para){
      const ab=sub(B,A), dc=sub(C,D), ad=sub(D,A), bc=sub(C,B);
      const cr=(u,v)=>Math.abs(u.x*v.y-u.y*v.x)/((Math.hypot(u.x,u.y)*Math.hypot(v.x,v.y))||1);
      if(cr(ab,dc)<0.01 || cr(ad,bc)<0.01) return '사다리꼴';
      return '사각형';
    }
    const eqSide = Math.abs(dist(A,B)-dist(B,C)) < 0.5;
    const right  = Math.abs(angleAt(B,A,C)-90) < 0.05;
    if(eqSide && right) return '정사각형';
    if(right)  return '직사각형';
    if(eqSide) return '마름모';
    return '평행사변형';
  }

  function exQuadDraw(){
    const {A,B,C,D}=ex, ink='#1A1A1A', teal='#0D9488', blue='#2563EB', red='#DC2626';
    if(!A||!D) return;
    exSeg(A,B,ink,2.5); exSeg(B,C,ink,2.5); exSeg(C,D,ink,2.5); exSeg(D,A,ink,2.5);

    if(ex.opts.diags){
      exSeg(A,C,teal,2); exSeg(B,D,teal,2);
      const O=lineX(A,sub(C,A),B,sub(D,B));
      if(O){
        exDot(O,red,5); exLabel(O,'O',red,16,-12);
        exTick(A,O,1,teal); exTick(O,C,1,teal);
        exTick(B,O,2,teal); exTick(O,D,2,teal);
        if(CONFIG.explore==='quadkinds' && ex.opts.right){
          const k=exQuadKind();
          if(k==='마름모'||k==='정사각형') exRightMark(O, sub(A,O), sub(B,O), 10);
        }
      }
    }
    if(ex.opts.sides){
      exTick(A,B,1); exTick(D,C,1);              // 대변 AB, DC
      exTick(B,C,2); exTick(A,D,2);              // 대변 BC, AD
    }
    if(ex.opts.angles){
      exArcAt(A,D,B,34,blue); exArcAt(C,B,D,34,blue);
      exArcAt(B,A,C,40,red);  exArcAt(D,C,A,40,red);
    }
    if(ex.opts.right && CONFIG.explore==='quadkinds'){
      const k=exQuadKind();
      if(k==='직사각형'||k==='정사각형'){
        [[A,D,B],[B,A,C],[C,B,D],[D,C,A]].forEach(([P,X,Y])=>exRightMark(P, sub(X,P), sub(Y,P), 12));
      }
    }
    const fixed = (CONFIG.explore==='quadkinds');
    exHandle(A,'A'); exHandle(C,'C');
    if(fixed){ exDot(B,'#9CA3AF',7); exLabel(B,'B',ink,-20,18); exDot(D,'#9CA3AF',7); exLabel(D,'D',ink,18,-16); }
    else { exHandle(B,'B'); exHandle(D,'D'); }
  }
  // 점 P에서 X, Y 방향 사이의 각에 호를 그린다
  function exArcAt(P,X,Y,r,color){
    const a1=Math.atan2(X.y-P.y,X.x-P.x), a2=Math.atan2(Y.y-P.y,Y.x-P.x);
    let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    exCtx.save(); exCtx.strokeStyle=color; exCtx.lineWidth=2.4;
    exCtx.beginPath(); exCtx.arc(P.x,P.y,r,a1,a1+d,d<0); exCtx.stroke(); exCtx.restore();
  }

  function exQuadUpdate(){
    const {A,B,C,D}=ex, items=[];
    let msg='';
    const kind=exQuadKind();
    if(CONFIG.explore==='parallelogram'){
      if(ex.opts.sides){
        items.push({k:'AB', v:cm(dist(A,B))+' cm'});
        items.push({k:'DC', v:cm(dist(D,C))+' cm', eq:Math.abs(dist(A,B)-dist(D,C))<0.5});
        items.push({k:'BC', v:cm(dist(B,C))+' cm'});
        items.push({k:'AD', v:cm(dist(A,D))+' cm', eq:Math.abs(dist(B,C)-dist(A,D))<0.5});
      }
      if(ex.opts.angles){
        const a=angleAt(A,D,B), c=angleAt(C,B,D), b=angleAt(B,A,C), d=angleAt(D,C,A);
        items.push({k:'∠A', v:a.toFixed(1)+'°'});
        items.push({k:'∠C', v:c.toFixed(1)+'°', eq:Math.abs(a-c)<0.05});
        items.push({k:'∠B', v:b.toFixed(1)+'°'});
        items.push({k:'∠D', v:d.toFixed(1)+'°', eq:Math.abs(b-d)<0.05});
      }
      if(ex.opts.diags){
        const O=lineX(A,sub(C,A),B,sub(D,B));
        if(O){
          items.push({k:'AO', v:cm(dist(A,O))+' cm'});
          items.push({k:'OC', v:cm(dist(O,C))+' cm', eq:Math.abs(dist(A,O)-dist(O,C))<0.5});
          items.push({k:'BO', v:cm(dist(B,O))+' cm'});
          items.push({k:'OD', v:cm(dist(O,D))+' cm', eq:Math.abs(dist(B,O)-dist(O,D))<0.5});
        }
      }
      if(!items.length) items.push({k:'안내', v:'아래 버튼으로 무엇을 볼지 골라 보세요'});
      items.push({k:'이 사각형은', v:kind});
      if(kind==='평행사변형') msg='두 쌍의 대변이 각각 평행합니다. 평행사변형이 되었어요.';
    } else {
      items.push({k:'AB', v:cm(dist(A,B))+' cm'});
      items.push({k:'BC', v:cm(dist(B,C))+' cm', eq:Math.abs(dist(A,B)-dist(B,C))<0.5});
      items.push({k:'∠B', v:angleAt(B,A,C).toFixed(1)+'°'});
      if(ex.opts.diags){
        items.push({k:'AC', v:cm(dist(A,C))+' cm'});
        items.push({k:'BD', v:cm(dist(B,D))+' cm', eq:Math.abs(dist(A,C)-dist(B,D))<0.5});
      }
      items.push({k:'이 사각형은', v:kind});
      if(kind==='직사각형') msg='네 각이 모두 직각입니다. 두 대각선의 길이를 비교해 보세요.';
      if(kind==='마름모')   msg='네 변의 길이가 모두 같습니다. 두 대각선이 만나는 각을 살펴보세요.';
      if(kind==='정사각형') msg='직사각형이면서 마름모입니다.';
    }
    return {items, msg};
  }

  function exResize(){
    if(!exCv||!exWrap) return;
    const w=exWrap.clientWidth, h=exWrap.clientHeight;
    if(!w||!h) return;
    if(ex.A && exW===w && exH===h){ exDraw(); exUpdate(); return; }
    const first = !exW || !exH || !ex.A;
    const rx = first?1:(w/exW), ry = first?1:(h/exH);
    exCv.width=w; exCv.height=h; exW=w; exH=h;
    if(first){ exInitPoints(); }
    else{
      ['A','B','C','D'].forEach(k=>{ if(ex[k]){ ex[k].x*=rx; ex[k].y*=ry; } });
      if(!isQuadMode()) ex.lockLen=dist(ex.A,ex.B);
    }
    exDraw(); exUpdate();
  }

  function exRenderTools(){
    const box=document.getElementById('exTools'); box.innerHTML='';
    exDef.tools.forEach(t=>{
      const b=document.createElement('button');
      b.className='chip'+(t.action?' plain':'');
      b.id='chip_'+t.k;
      b.textContent=t.label;
      b.onclick=()=>exToolClick(t);
      box.appendChild(b);
    });
    exSyncChips();
  }
  function exSyncChips(){
    exDef.tools.forEach(t=>{
      const b=document.getElementById('chip_'+t.k); if(!b) return;
      if(t.group==='preset') b.classList.toggle('on', ex.preset===t.k);
      else if(!t.action)     b.classList.toggle('on', !!ex.opts[t.k]);
    });
  }
  function exToolClick(t){
    if(t.group==='preset'){ ex.preset=t.k; ex.t2=exT2Start(); }
    else if(t.action){
      if(t.k==='rotL') ex.t2.rot-=15;
      if(t.k==='rotR') ex.t2.rot+=15;
      if(t.k==='flip') ex.t2.flip*=-1;
    }
    else{
      ex.opts[t.k]=!ex.opts[t.k];
      if(t.k==='lock' && ex.opts.lock){
        if(isQuadMode()) ex.D=add(sub(ex.A,ex.B), ex.C);   // 켜는 즉시 평행사변형으로
        else { ex.lockLen=dist(ex.A,ex.B); exApplyLock('C'); }
      }
    }
    exSyncChips(); exDraw(); exUpdate();
  }

  // ★ 표시 정밀도 때문에 "변은 같은데 밑각이 다르다"고 보이는 것을 막는다.
  //   길이는 0.1cm(≈9px) 단위로 반올림돼 표시되므로, 그 안쪽으로 들어오면
  //   아예 정확히 AB=AC로 붙여 버린다. → 같아 보이면 실제로도 같다.
  function exIsoTol(){ return 0.1*((exW||600)/CANVAS_CM); }
  function exSnapIso(which){
    const {A,B,C}=ex;
    if(Math.abs(dist(A,B)-dist(A,C)) >= exIsoTol()) return;
    if(which==='C')      ex.C=add(A, mul(norm(sub(C,A)), dist(A,B)));
    else if(which==='B') ex.B=add(A, mul(norm(sub(B,A)), dist(A,C)));
    else {  // A를 끄는 경우: BC의 수직이등분선 위로 A를 올린다
      const M=mid(B,C), u=norm(perp(sub(C,B)));
      const t=(A.x-M.x)*u.x+(A.y-M.y)*u.y;
      ex.A=add(M, mul(u,t));
    }
  }
  function exIsIso(){ return Math.abs(dist(ex.A,ex.B)-dist(ex.A,ex.C)) < 0.5; }

  // AB=AC 고정: 지정한 점을 A로부터 lockLen 거리로 이동
  function exApplyLock(which){
    if(!ex.opts.lock) return;
    if(which==='C'){ ex.C=add(ex.A, mul(norm(sub(ex.C,ex.A)), ex.lockLen)); }
    else if(which==='B'){ ex.B=add(ex.A, mul(norm(sub(ex.B,ex.A)), ex.lockLen)); }
    else { // A를 옮긴 경우: B, C 둘 다 거리 유지
      ex.B=add(ex.A, mul(norm(sub(ex.B,ex.A)), ex.lockLen));
      ex.C=add(ex.A, mul(norm(sub(ex.C,ex.A)), ex.lockLen));
    }
  }

  /* ── 그리기 ── */
  function exClear(){
    exCtx.clearRect(0,0,exW,exH);
    exCtx.fillStyle='#fff'; exCtx.fillRect(0,0,exW,exH);
  }
  function exSeg(p,q,color,width,dash){
    exCtx.save();
    exCtx.strokeStyle=color; exCtx.lineWidth=width||2; exCtx.lineCap='round';
    if(dash) exCtx.setLineDash(dash);
    exCtx.beginPath(); exCtx.moveTo(p.x,p.y); exCtx.lineTo(q.x,q.y); exCtx.stroke();
    exCtx.restore();
  }
  function exDot(p,color,r){
    exCtx.save(); exCtx.fillStyle=color||'#1A1A1A';
    exCtx.beginPath(); exCtx.arc(p.x,p.y,r||4,0,Math.PI*2); exCtx.fill(); exCtx.restore();
  }
  function exHandle(p,label){
    exCtx.save();
    exCtx.fillStyle='#fff'; exCtx.strokeStyle='#1A1A1A'; exCtx.lineWidth=2.5;
    exCtx.beginPath(); exCtx.arc(p.x,p.y,9,0,Math.PI*2); exCtx.fill(); exCtx.stroke();
    exCtx.fillStyle='#1A1A1A'; exCtx.font='700 16px Pretendard, sans-serif';
    exCtx.textAlign='center'; exCtx.textBaseline='middle';
    exCtx.fillText(label, p.x, p.y-22);
    exCtx.restore();
  }
  function exLabel(p,text,color,dx,dy){
    exCtx.save();
    exCtx.fillStyle=color||'#1A1A1A'; exCtx.font='600 14px Pretendard, sans-serif';
    exCtx.textAlign='center'; exCtx.textBaseline='middle';
    exCtx.fillText(text, p.x+(dx||0), p.y+(dy||0));
    exCtx.restore();
  }
  // 직선을 캔버스 밖까지 길게
  function exLongLine(P,dir,color,width,dash){
    const L=Math.max(exW,exH)*2, u=norm(dir);
    exSeg({x:P.x-u.x*L,y:P.y-u.y*L},{x:P.x+u.x*L,y:P.y+u.y*L},color,width,dash);
  }
  function exCircle(O,r,color){
    exCtx.save(); exCtx.strokeStyle=color; exCtx.lineWidth=2;
    exCtx.beginPath(); exCtx.arc(O.x,O.y,r,0,Math.PI*2); exCtx.stroke(); exCtx.restore();
  }
  // 직각 표시
  function exRightMark(P,u,v,size){
    const s=size||11, a=add(P,mul(norm(u),s)), b=add(P,mul(norm(v),s));
    const c=add(a, mul(norm(v),s));
    exSeg(a,c,'#DC2626',1.6); exSeg(c,b,'#DC2626',1.6);
  }
  // 변에 같음 표시(빗금)
  function exTick(p,q,n,color){
    const m=mid(p,q), u=norm(sub(q,p)), w=perp(u);
    for(let i=0;i<n;i++){
      const off=(i-(n-1)/2)*5;
      const c=add(m, mul(u,off));
      exSeg(add(c,mul(w,6)), add(c,mul(w,-6)), color||'#DC2626', 2);
    }
  }

  function exDraw(){
    if(!exCtx) return;
    exClear();
    if(isQuadMode()){ exQuadDraw(); return; }
    if(exMode==='congruence'){ exDrawCongruence(); return; }
    const {A,B,C}=ex;
    if(!A) return;

    // 삼각형
    exSeg(A,B,'#1A1A1A',2.5); exSeg(B,C,'#1A1A1A',2.5); exSeg(C,A,'#1A1A1A',2.5);

    if(exMode==='isosceles'){
      if(ex.opts.lock || exIsIso()){ exTick(A,B,1); exTick(A,C,1); }
      if(ex.opts.bisec){
        const dir=norm(add(norm(sub(B,A)), norm(sub(C,A))));
        const D=lineX(A,dir,B,sub(C,B));
        if(D){
          exSeg(A,D,'#0D9488',2.2);
          exDot(D,'#0D9488',4); exLabel(D,'D','#0D9488',0,20);
          exRightMark(D, sub(A,D), sub(C,D));
          exTick(B,D,2,'#0D9488'); exTick(D,C,2,'#0D9488');
        }
      }
    }

    if(exMode==='circumcenter'){
      const O=circumcenter(A,B,C);
      const pbs=[
        {on:ex.opts.pa, p:mid(B,C), d:perp(sub(C,B)), s:[B,C]},
        {on:ex.opts.pb, p:mid(C,A), d:perp(sub(A,C)), s:[C,A]},
        {on:ex.opts.pc, p:mid(A,B), d:perp(sub(B,A)), s:[A,B]}
      ];
      pbs.forEach(pb=>{
        if(!pb.on) return;
        exLongLine(pb.p, pb.d, '#0D9488', 2, [7,5]);
        exDot(pb.p,'#0D9488',3.5);
        exTick(pb.s[0],pb.p,1,'#0D9488'); exTick(pb.p,pb.s[1],1,'#0D9488');
        exRightMark(pb.p, norm(pb.d), norm(sub(pb.s[1],pb.s[0])), 9);
      });
      const shown=pbs.filter(p=>p.on).length;
      if(O && shown>=2){
        if(ex.opts.circle) exCircle(O, dist(O,A), '#2563EB');
        exDot(O,'#DC2626',5.5); exLabel(O,'O','#DC2626',14,-12);
        if(ex.opts.circle){
          exSeg(O,A,'#2563EB',1.6,[4,4]); exSeg(O,B,'#2563EB',1.6,[4,4]); exSeg(O,C,'#2563EB',1.6,[4,4]);
        }
      }
    }

    if(exMode==='incenter'){
      const I=incenter(A,B,C);
      const bas=[
        {on:ex.opts.ba, V:A, P:B, Q:C},
        {on:ex.opts.bb, V:B, P:C, Q:A},
        {on:ex.opts.bc, V:C, P:A, Q:B}
      ];
      bas.forEach(b=>{
        if(!b.on) return;
        const dir=norm(add(norm(sub(b.P,b.V)), norm(sub(b.Q,b.V))));
        const F=lineX(b.V,dir,b.P,sub(b.Q,b.P));
        if(F) exSeg(b.V,F,'#0D9488',2.2,[7,5]);
      });
      const shown=bas.filter(b=>b.on).length;
      if(I && shown>=2){
        exDot(I,'#DC2626',5.5); exLabel(I,'I','#DC2626',14,-12);
        if(ex.opts.circle){
          const D=footPerp(I,A,B), E=footPerp(I,B,C), F=footPerp(I,C,A);
          exCircle(I, dist(I,E), '#2563EB');
          [[D,A,B],[E,B,C],[F,C,A]].forEach(([P,X,Y])=>{
            exSeg(I,P,'#2563EB',1.6,[4,4]); exDot(P,'#2563EB',3.5);
            exRightMark(P, sub(I,P), sub(Y,X), 9);
          });
          exLabel(D,'D','#2563EB',-14,-6); exLabel(E,'E','#2563EB',0,18); exLabel(F,'F','#2563EB',14,-6);
        }
      }
    }

    exHandle(A,'A'); exHandle(B,'B'); exHandle(C,'C');
  }

  /* ── 5.2 두 직각삼각형 포개기 ── */
  function exTri1(){
    // 왼쪽 고정 직각삼각형 (∠B=90°)
    const s=Math.min(exW,exH);
    const bx=exW*0.20, by=exH*0.72;
    const w=s*0.30, h=s*0.42;
    return { B:{x:bx,y:by}, C:{x:bx+w,y:by}, A:{x:bx,y:by-h} };
  }
  function exTri2Base(){
    // 조건에 따라 합동인 짝 (RHA: 빗변+예각 / RHS: 빗변+다른 한 변)
    const t=exTri1();
    return { E:{x:0,y:0}, F:{x:dist(t.B,t.C), y:0}, D:{x:0, y:-dist(t.A,t.B)} };
  }
  function exTri2Pts(){
    const b=exTri2Base(), th=ex.t2.rot*Math.PI/180;
    const cos=Math.cos(th), sin=Math.sin(th);
    const tr=p=>{
      const x=p.x*ex.t2.flip, y=p.y;
      return { x: x*cos - y*sin + ex.t2.dx, y: x*sin + y*cos + ex.t2.dy };
    };
    return { D:tr(b.D), E:tr(b.E), F:tr(b.F) };
  }
  function exDrawCongruence(){
    const t=exTri1(), u=exTri2Pts();
    // 삼각형 1
    exSeg(t.A,t.B,'#1A1A1A',2.5); exSeg(t.B,t.C,'#1A1A1A',2.5); exSeg(t.C,t.A,'#1A1A1A',2.5);
    exRightMark(t.B, sub(t.A,t.B), sub(t.C,t.B));
    exLabel(t.A,'A','#1A1A1A',-14,-8); exLabel(t.B,'B','#1A1A1A',-14,14); exLabel(t.C,'C','#1A1A1A',12,14);
    exTick(t.A,t.C,2);
    if(ex.preset==='rha'){
      exLabel(mid(t.A,t.C),Math.round(angleAt(t.C,t.A,t.B))+'°','#DC2626',22,14);
    } else {
      exTick(t.B,t.C,1,'#2563EB');
    }
    // 삼각형 2 (움직임)
    exSeg(u.D,u.E,'#0D9488',2.5); exSeg(u.E,u.F,'#0D9488',2.5); exSeg(u.F,u.D,'#0D9488',2.5);
    exRightMark(u.E, sub(u.D,u.E), sub(u.F,u.E));
    exLabel(u.D,'D','#0D9488',-14,-8); exLabel(u.E,'E','#0D9488',-14,14); exLabel(u.F,'F','#0D9488',12,14);
    exTick(u.D,u.F,2,'#0D9488');
    if(ex.preset==='rha'){
      exLabel(mid(u.D,u.F),Math.round(angleAt(u.F,u.D,u.E))+'°','#DC2626',22,14);
    } else {
      exTick(u.E,u.F,1,'#2563EB');
    }
    exHandle(u.E,'');
  }
  function exCongruenceMatched(){
    const t=exTri1(), u=exTri2Pts(), tol=14;
    return dist(t.A,u.D)<tol && dist(t.B,u.E)<tol && dist(t.C,u.F)<tol;
  }

  /* ── 측정값 표시 ── */
  function exUpdate(){
    const box=document.getElementById('exReadout');
    const note=document.getElementById('exNote');
    if(!box) return;
    const {A,B,C}=ex;
    let items=[], msg='';

    if(isQuadMode()){
      if(ex.A){ const q=exQuadUpdate(); items=q.items; msg=q.msg; }
    }
    else if(exMode==='congruence'){
      const ok=exCongruenceMatched();
      items=[{k:'조건', v: ex.preset==='rha' ? '빗변 + 한 예각' : '빗변 + 다른 한 변'}];
      if(ok) msg='두 삼각형이 완전히 포개졌습니다. 즉, 두 직각삼각형은 서로 합동입니다.';
    }
    else if(A){
      const angB=angleAt(B,A,C), angC=angleAt(C,A,B);
      if(exMode==='isosceles'){
        items=[
          {k:'AB', v:cm(dist(A,B))+' cm'},
          {k:'AC', v:cm(dist(A,C))+' cm', eq:Math.abs(dist(A,B)-dist(A,C))<0.5},
          {k:'∠B', v:angB.toFixed(1)+'°'},
          {k:'∠C', v:angC.toFixed(1)+'°', eq:Math.abs(angB-angC)<0.05}
        ];
        if(ex.opts.bisec){
          const dir=norm(add(norm(sub(B,A)), norm(sub(C,A))));
          const D=lineX(A,dir,B,sub(C,B));
          if(D){
            items.push({k:'BD', v:cm(dist(B,D))+' cm'});
            items.push({k:'DC', v:cm(dist(D,C))+' cm', eq:Math.abs(dist(B,D)-dist(D,C))<0.5});
            items.push({k:'∠ADB', v:angleAt(D,A,B).toFixed(1)+'°'});
          }
        }
      }
      else if(exMode==='circumcenter'){
        const O=circumcenter(A,B,C);
        const shown=['pa','pb','pc'].filter(k=>ex.opts[k]).length;
        if(O && shown>=2){
          items=[
            {k:'OA', v:cm(dist(O,A))+' cm'},
            {k:'OB', v:cm(dist(O,B))+' cm', eq:true},
            {k:'OC', v:cm(dist(O,C))+' cm', eq:true}
          ];
          if(shown===3) msg='세 변의 수직이등분선이 한 점 O에서 만납니다.';
        } else {
          items=[{k:'안내', v:'수직이등분선을 2개 이상 그어 보세요'}];
        }
        const tk=triKind(A,B,C);
        items.push({k:'삼각형', v:tk.kind});
        if(O && shown>=2) items.push({k:'점 O의 위치', v:tk.pos});
      }
      else if(exMode==='incenter'){
        const I=incenter(A,B,C);
        const shown=['ba','bb','bc'].filter(k=>ex.opts[k]).length;
        if(I && shown>=2){
          const D=footPerp(I,A,B), E=footPerp(I,B,C), F=footPerp(I,C,A);
          items=[
            {k:'ID', v:cm(dist(I,D))+' cm'},
            {k:'IE', v:cm(dist(I,E))+' cm', eq:true},
            {k:'IF', v:cm(dist(I,F))+' cm', eq:true}
          ];
          if(shown===3) msg='세 내각의 이등분선이 한 점 I에서 만납니다.';
        } else {
          items=[{k:'안내', v:'각의 이등분선을 2개 이상 그어 보세요'}];
        }
      }
    }

    box.innerHTML='';
    items.forEach(it=>{
      const el=document.createElement('div');
      el.className='rd'+(it.eq?' eq':'');
      el.innerHTML='<span class="k">'+it.k+'</span><span class="v">'+it.v+'</span>';
      box.appendChild(el);
    });
    note.textContent=msg;
    note.classList.toggle('show', !!msg);
  }

  /* ── 탐구 캔버스 입력 ── */
  function exPos(e){
    const r=exCv.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function exDown(e){
    const p=exPos(e);
    if(isQuadMode()){
      const keys = (CONFIG.explore==='quadkinds') ? ['A','C'] : ['A','B','C','D'];
      let best=null, bd=1e9;
      keys.forEach(k=>{ const d=dist(p,ex[k]); if(d<bd){ bd=d; best=k; } });
      if(bd<34) ex.drag=best;
      return;
    }
    if(exMode==='congruence'){
      const u=exTri2Pts();
      if(dist(p,u.E)<34 || dist(p,u.D)<34 || dist(p,u.F)<34){
        ex.drag={t2:true, ox:p.x-ex.t2.dx, oy:p.y-ex.t2.dy};
      }
      return;
    }
    let best=null, bd=1e9;
    ['A','B','C'].forEach(k=>{ const d=dist(p,ex[k]); if(d<bd){ bd=d; best=k; } });
    if(bd<30) ex.drag=best;
  }
  function exMove(e){
    if(!ex.drag) return;
    const p=exPos(e);
    if(isQuadMode()){
      const k=ex.drag;
      ex[k]={x:Math.max(26,Math.min(exW-26,p.x)), y:Math.max(32,Math.min(exH-26,p.y))};
      if(CONFIG.explore==='quadkinds'){
        exSnapKind(k);                                   // 직각 / 같은 변 길이로 붙이기
        ex.D=add(sub(ex.A,ex.B), ex.C);                  // 평행사변형 유지
      } else if(ex.opts.lock){
        if(k==='D') ex.D=add(sub(ex.A,ex.B), ex.C);
        else if(k==='A') ex.A=add(sub(ex.D,ex.C), ex.B);
        else if(k==='B') ex.B=add(sub(ex.A,ex.D), ex.C);
        else ex.C=add(sub(ex.D,ex.A), ex.B);
      } else {
        exSnapPara(k);                                   // 거의 평행사변형이면 정확히 맞춰 준다
      }
      exDraw(); exUpdate();
      return;
    }
    if(ex.drag.t2){ ex.t2.dx=p.x-ex.drag.ox; ex.t2.dy=p.y-ex.drag.oy; }
    else{
      const k=ex.drag;
      const prev={A:{...ex.A}, B:{...ex.B}, C:{...ex.C}}, prevLen=ex.lockLen;
      ex[k]={x:Math.max(24,Math.min(exW-24,p.x)), y:Math.max(30,Math.min(exH-24,p.y))};
      if(ex.opts.lock){
        if(k==='A') exApplyLock('A');
        else if(k==='B'){ ex.lockLen=dist(ex.A,ex.B); exApplyLock('C'); }
        else exApplyLock('C');
      }
      else if(exMode==='isosceles') exSnapIso(k);
      // 거의 일직선이 되면 되돌린다(화면이 깨지는 것을 방지)
      if(tooFlat(ex.A,ex.B,ex.C)){ ex.A=prev.A; ex.B=prev.B; ex.C=prev.C; ex.lockLen=prevLen; }
    }
    exDraw(); exUpdate();
  }
  function exUp(){ ex.drag=null; }

  /* ══════════════ 문제 풀기 스케치북 ══════════════ */
  let activeIdx=0;
  let strokes=[], curStroke=null;
  let penColor='#1A1A1A', eraserOn=false, lineMode=false, dragging=false;
  let bgImg=null, bgReady=false;

  let cv, ctx, skwrap;
  // 학생의 필기만 담는 별도 레이어. 지우개는 이 레이어에서만 지우므로
  // 배경(문제 그림)은 절대 지워지지 않는다.
  let inkCv=null, inkCtx=null;
  function ensureInk(w,h){
    if(!inkCv){ inkCv=document.createElement('canvas'); inkCtx=inkCv.getContext('2d'); }
    if(inkCv.width!==w || inkCv.height!==h){ inkCv.width=w; inkCv.height=h; }
  }

  function resize(){
    if(!cv||!skwrap) return;
    const w=skwrap.clientWidth, h=skwrap.clientHeight;
    if(!w||!h) return;
    if(cv.width===w && cv.height===h){ draw(); return; }
    cv.width=w; cv.height=h; draw();
  }

  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    // 문제 그림을 배경으로 (그 위에 바로 필기)
    if(bgImg && bgReady && bgImg.width){
      const maxW=cv.width*0.86, maxH=cv.height*0.62;
      const s=Math.min(maxW/bgImg.width, maxH/bgImg.height, 1.6);
      const w=bgImg.width*s, h=bgImg.height*s;
      ctx.drawImage(bgImg, (cv.width-w)/2, cv.height*0.04, w, h);
    }
    // 필기는 별도 레이어에 그리고, 지우개는 그 레이어에서만 지운다
    ensureInk(cv.width, cv.height);
    inkCtx.clearRect(0,0,inkCv.width,inkCv.height);
    inkCtx.lineCap='round'; inkCtx.lineJoin='round';
    const all = curStroke ? strokes.concat([curStroke]) : strokes;
    all.forEach(s=>{
      if(!s.pts.length) return;
      inkCtx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      inkCtx.strokeStyle = s.erase ? '#000' : s.color;
      inkCtx.lineWidth = s.width;
      inkCtx.beginPath(); inkCtx.moveTo(s.pts[0].x,s.pts[0].y);
      for(let i=1;i<s.pts.length;i++) inkCtx.lineTo(s.pts[i].x,s.pts[i].y);
      inkCtx.stroke();
    });
    inkCtx.globalCompositeOperation='source-over';
    ctx.drawImage(inkCv,0,0);
  }
  function pos(e){
    const r=cv.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function startDraw(e){
    dragging=true; const p=pos(e);
    curStroke={color:penColor, width:eraserOn?22:2.5, erase:eraserOn, pts: lineMode?[p,p]:[p]};
    draw();
  }
  function moveDraw(e){
    if(!dragging||!curStroke) return;
    const p=pos(e);
    if(lineMode) curStroke.pts[1]=p; else curStroke.pts.push(p);
    draw();
  }
  function endDraw(){
    if(curStroke){ if(curStroke.pts.length) strokes.push(curStroke); curStroke=null; draw(); }
    dragging=false;
  }
  function setPen(c,el){
    penColor=c; eraserOn=false; lineMode=false;

    document.getElementById('eraserBtn').classList.remove('active');
    document.getElementById('lineBtn').classList.remove('active');
  }
  function toggleEraser(){
    eraserOn=!eraserOn;

    document.getElementById('eraserBtn').classList.toggle('active', eraserOn);

  function toggleLineMode(){
    lineMode=!lineMode;
    if(lineMode){ eraserOn=false; document.getElementById('eraserBtn').classList.remove('active'); }
    document.getElementById('lineBtn').classList.toggle('active', lineMode);
  }
  function undoStroke(){ if(strokes.length){ strokes.pop(); draw(); } }
  function clearSketch(){
    if(strokes.length && !confirm('필기한 내용을 모두 지울까요?')) return;

  /* ── 증명 화면 위에 직접 필기하는 펜 ── */
  let pfStrokes=[], pfCur=null, pfPen='#DC2626', pfErase=false, pfLine=false, pfDrag=false;
  let pfWidth=4.5;   // 증명 전용 펜 두께(얇게 2.5 / 보통 4.5 / 굵게 8)
  let pfInk=null, pfInkCtx=null;
  function pfInkPaint(){
    if(!pfW||!pfH) return;
    if(!pfInk){ pfInk=document.createElement('canvas'); pfInkCtx=pfInk.getContext('2d'); }
    if(pfInk.width!==pfW || pfInk.height!==pfH){ pfInk.width=pfW; pfInk.height=pfH; }
    pfInkCtx.clearRect(0,0,pfW,pfH);
    pfInkCtx.lineCap='round'; pfInkCtx.lineJoin='round';
    const all = pfCur ? pfStrokes.concat([pfCur]) : pfStrokes;
    all.forEach(s=>{
      if(!s.pts.length) return;
      pfInkCtx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      pfInkCtx.strokeStyle = s.erase ? '#000' : s.color;
      pfInkCtx.lineWidth = s.width;
      pfInkCtx.beginPath(); pfInkCtx.moveTo(s.pts[0].x, s.pts[0].y);
      for(let i=1;i<s.pts.length;i++) pfInkCtx.lineTo(s.pts[i].x, s.pts[i].y);
      pfInkCtx.stroke();
    });
    pfInkCtx.globalCompositeOperation='source-over';
    pfCtx.drawImage(pfInk,0,0);
  }
  function pfPos(e){
    const r=pfCv.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;

    pfCur={color:pfPen, width: pfErase ? pfWidth*6 : pfWidth, erase:pfErase, pts: pfLine?[p,p]:[p]};
    pfDraw();

  function pfMove(e){
    if(!pfDrag||!pfCur) return;
    const p=pfPos(e);
    if(pfLine) pfCur.pts[1]=p; else pfCur.pts.push(p);
    pfDraw();
  }
  function pfUp(){ if(pfCur){ if(pfCur.pts.length) pfStrokes.push(pfCur); pfCur=null; pfDraw(); } pfDrag=false; }
  function pfSetPen(c,el){
    pfPen=c; pfErase=false;
    document.querySelectorAll('#pfTools .sk-dot').forEach(d=>d.classList.remove('active'));
    if(el) el.classList.add('active');
    document.getElementById('pfEraserBtn').classList.remove('active');
  }
  function pfSetWidth(w, el){
    pfWidth=w;
    ['pfW1','pfW2','pfW3'].forEach(id=>{ const b=document.getElementById(id); if(b) b.classList.remove('active'); });
    if(el) el.classList.add('active');
  }
  function pfToggleEraser(){
    pfErase=!pfErase;
    if(pfErase){ pfLine=false; document.getElementById('pfLineBtn').classList.remove('active'); }
    document.getElementById('pfEraserBtn').classList.toggle('active', pfErase);
  }
  function pfToggleLine(){
    pfLine=!pfLine;
    if(pfLine){ pfErase=false; document.getElementById('pfEraserBtn').classList.remove('active'); }
    document.getElementById('pfLineBtn').classList.toggle('active', pfLine);
  }
  function pfUndo(){ if(pfStrokes.length){ pfStrokes.pop(); pfDraw(); } }
  function pfClearInk(){ pfStrokes=[]; pfCur=null; pfDraw(); }

  function pfDef(){ return PROOFS[pf.type]; }

  // 단계별 목표 상태(뒤집기 진행도, 이동 진행도)
  function pfTarget(step){
    if(pf.type!=='rhs') return {flip:0, move:0};
    if(step<=0) return {flip:0, move:0};
    if(step===1) return {flip:1, move:0};
    return {flip:1, move:1};
  }

  // 5.1 / 5.3 / 5.4 증명용 삼각형 배치
  function pfTri(){
    // 칸의 가로·세로 어느 쪽이 짧아도 삼각형이 찌그러지지 않도록 둘 다 반영
    const half=Math.min(pfFW*0.30, pfH*0.30);
    // 외심/내심은 마지막에 외접원·내접원을 그리므로 삼각형을 조금 작게 잡아 원이 화면 안에 들어오게 한다
    const kh  =(pf.type==='iso')?0.62:0.54;
    const hgt =Math.min(pfH*kh, pfFW*kh);
    const cx=pfFW*0.50, cy=pfH*0.52;
    const top=cy-hgt*0.5, bot=cy+hgt*0.5;
    if(pf.type==='iso'){                    // 이등변삼각형(좌우대칭)
      return { A:{x:cx, y:top}, B:{x:cx-half, y:bot}, C:{x:cx+half, y:bot} };
    }
    // 외심/내심은 일반 삼각형(예각)이어야 관찰이 자연스럽다
    return { A:{x:cx-half*0.25, y:top}, B:{x:cx-half*1.06, y:bot}, C:{x:cx+half*1.02, y:bot} };
  }

  function pfGeom(){
    // 세로로 긴 칸에서도 삼각형이 홀쭉해지지 않도록 a를 b에 묶어 둔다
    const b=Math.min(pfFW*0.21, pfH*0.30);  // BC(가로)
    const a=Math.min(pfH*0.52, b*1.9);     // AC(세로)
    // 맞붙인 뒤의 △ABE가 도형 영역 안에 들어오도록.
    // ★ fx(△DEF 시작 위치)는 "뒤집었을 때"(2단계) E가 fx+b까지 오른쪽으로 나가므로
    //   fx+b가 도형 영역을 넘지 않게 0.72로 잡는다(0.88이면 필기 공간을 침범했다).
    const cx=pfFW*0.46, cy=pfH*0.5+a*0.5;  // △ABC의 직각 꼭짓점 C
    const fx=pfFW*0.72, fy=cy;             // △DEF의 직각 꼭짓점 F(시작 위치)
    const A={x:cx, y:cy-a}, B={x:cx-b, y:cy}, C={x:cx, y:cy};
    // DEF: 시작은 ABC와 같은 방향, F를 기준으로 좌우 뒤집기 → C로 평행이동
    const raw={ D:{x:fx, y:fy-a}, E:{x:fx-b, y:fy}, F:{x:fx, y:fy} };
    const s=1-2*pf.flip;                                   // 1 → -1
    const ox=(cx-fx)*pf.move, oy=(cy-fy)*pf.move;
    const t=p=>({ x: fx+(p.x-fx)*s+ox, y: p.y+oy });
    return { A,B,C, D:t(raw.D), E:t(raw.E), F:t(raw.F), a, b };
  }

  function pfDrawTri(P,Q,R,color,width){
    exCtxSet(pfCtx);
    pfSeg(P,Q,color,width); pfSeg(Q,R,color,width); pfSeg(R,P,color,width);
  }
  function exCtxSet(c){ c.lineCap='round'; c.lineJoin='round'; }
  function pfSeg(p,q,color,width,dash){
    pfCtx.save(); pfCtx.strokeStyle=color; pfCtx.lineWidth=width||3; pfCtx.lineCap='round';
    if(dash) pfCtx.setLineDash(dash);
    pfCtx.beginPath(); pfCtx.moveTo(p.x,p.y); pfCtx.lineTo(q.x,q.y); pfCtx.stroke(); pfCtx.restore();
  }
  function pfLabel(p,text,color,dx,dy,size){
    pfCtx.save(); pfCtx.fillStyle=color||'#1A1A1A';
    pfCtx.font='700 '+(size||20)+'px Pretendard, sans-serif';
    pfCtx.textAlign='center'; pfCtx.textBaseline='middle';
    pfCtx.fillText(text, p.x+(dx||0), p.y+(dy||0)); pfCtx.restore();
  }
  function pfRight(P,u,v,color){
    const s=15, a=add(P,mul(norm(u),s)), b=add(P,mul(norm(v),s)), c=add(a,mul(norm(v),s));
    pfSeg(a,c,color||'#DC2626',2); pfSeg(c,b,color||'#DC2626',2);
  }
  function pfTick(p,q,n,color){
    const m=mid(p,q), u=norm(sub(q,p)), w=perp(u);
    for(let i=0;i<n;i++){
      const c=add(m, mul(u,(i-(n-1)/2)*6));
      pfSeg(add(c,mul(w,8)), add(c,mul(w,-8)), color||'#DC2626', 2.5);
    }
  }
  function pfArc(P,X,Y,r,color,label){
    const a1=Math.atan2(X.y-P.y,X.x-P.x), a2=Math.atan2(Y.y-P.y,Y.x-P.x);
    let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    pfCtx.save(); pfCtx.strokeStyle=color; pfCtx.lineWidth=3;
    pfCtx.beginPath(); pfCtx.arc(P.x,P.y,r,a1,a1+d,d<0); pfCtx.stroke(); pfCtx.restore();
    if(label){
      const am=a1+d/2;
      pfLabel({x:P.x+Math.cos(am)*(r+20), y:P.y+Math.sin(am)*(r+20)}, label, color, 0,0, 17);
    }
  }

  // 도형 영역과 필기 공간의 경계를 아주 연하게 표시(교사가 도형 위에 겹쳐 쓰지 않도록)
  function pfGuide(){
    if(pfLogOn || pfFW>=pfW-1) return;
    pfCtx.save();
    pfCtx.strokeStyle='#EEF2F6'; pfCtx.lineWidth=1.5; pfCtx.setLineDash([7,8]);
    pfCtx.beginPath(); pfCtx.moveTo(Math.round(pfFW)+0.5, 10); pfCtx.lineTo(Math.round(pfFW)+0.5, pfH-10); pfCtx.stroke();
    pfCtx.restore();
  }

  function pfDraw(){
    if(!pfCtx) return;
    if(!pfW || !pfH) return;      // 탭이 아직 안 열려 크기가 0일 때는 그리지 않는다
    pfCtx.clearRect(0,0,pfW,pfH);
    pfCtx.fillStyle='#fff'; pfCtx.fillRect(0,0,pfW,pfH);
    pfGuide();
    const s=pf.step, ink='#1A1A1A', teal='#0D9488', blue='#2563EB', red='#DC2626';

    // 교과서 예제: 생성 도형 대신 교과서 그림을 띄우고 그 위에 필기한다
    const def=pfDef();
    if(def.img){
      const im=pfImgs[def.img];
      if(im && im.complete && im.naturalWidth){
        const sc=Math.min(pfFW*0.92/im.naturalWidth, pfH*0.88/im.naturalHeight);
        const w=im.naturalWidth*sc, h=im.naturalHeight*sc;
        pfCtx.drawImage(im, (pfFW-w)/2, (pfH-h)/2, w, h);
      }
      pfInkPaint();
      return;
    }

    const g=pfGeom();
    if(def.quad){ pfDrawQuad(def.quad, s, ink, teal, blue, red); pfInkPaint(); return; }
    if(pf.type==='iso'){ pfDrawIso(s,ink,teal,blue,red); pfInkPaint(); return; }
    if(pf.type==='circum'){ pfDrawCircum(s,ink,teal,blue,red); pfInkPaint(); return; }
    if(pf.type==='incenter'){ pfDrawIncenter(s,ink,teal,blue,red); pfInkPaint(); return; }

    if(pf.type==='rha'){
      pfDrawTri(g.A,g.B,g.C,ink,3);
      pfDrawTri(g.D,g.E,g.F,teal,3);
      pfRight(g.C, sub(g.A,g.C), sub(g.B,g.C));
      pfRight(g.F, sub(g.D,g.F), sub(g.E,g.F));
      pfLabel(g.A,'A',ink,0,-20); pfLabel(g.B,'B',ink,-20,14); pfLabel(g.C,'C',ink,18,14);
      pfLabel(g.D,'D',teal,0,-20); pfLabel(g.E,'E',teal,-20,14); pfLabel(g.F,'F',teal,18,14);
      // 주어진 조건만 표시한다(AB = DE, ∠B = ∠E). 나머지는 교사가 펜으로.
      pfTick(g.A,g.B,2); pfTick(g.D,g.E,2,teal);
      pfArc(g.B,g.A,g.C,34,blue,'∠B'); pfArc(g.E,g.D,g.F,34,blue,'∠E');
      pfInkPaint();
      return;
    }

    // ── RHS ──
    pfDrawTri(g.A,g.B,g.C,ink,3);
    pfDrawTri(g.D,g.E,g.F,teal,3);
    pfRight(g.C, sub(g.A,g.C), sub(g.B,g.C));
    pfRight(g.F, sub(g.D,g.F), sub(g.E,g.F), teal);
    pfTick(g.A,g.B,2); pfTick(g.D,g.E,2,teal);        // AB = DE (빗변)
    pfTick(g.A,g.C,1,blue); pfTick(g.D,g.F,1,blue);   // AC = DF

    const joined = pf.move>0.98;
    pfLabel(g.B,'B',ink,-22,14);
    pfLabel(g.E,'E',teal,22,14);
    if(joined){
      pfLabel(g.A,'A(D)',ink,0,-22);
      pfLabel(g.C,'C(F)',ink,0,26);
    } else {
      pfLabel(g.A,'A',ink,0,-22); pfLabel(g.C,'C',ink,18,20);
      pfLabel(g.D,'D',teal,0,-22); pfLabel(g.F,'F',teal,18,20);
    }

    // 유도되는 표시(180°, 이등변 강조, ∠B=∠E 등)는 그리지 않는다 — 교사가 펜으로.
    pfInkPaint();
  }

  /* ── 5.1 이등변삼각형의 성질 증명 ── */
  function pfDrawIso(s,ink,teal,blue,red){
    const t=pfTri(), A=t.A, B=t.B, C=t.C, D=mid(B,C);
    pfSeg(A,B,ink,3); pfSeg(B,C,ink,3); pfSeg(C,A,ink,3);
    pfSeg(A,D,teal,2.6);
    pfTick(A,B,1); pfTick(A,C,1);                       // AB = AC
    pfArc(A,B,D,44,teal); pfArc(A,D,C,52,teal);         // ∠BAD = ∠CAD
    pfLabel(A,'A',ink,0,-24); pfLabel(B,'B',ink,-24,12); pfLabel(C,'C',ink,24,12);
    pfLabel(D,'D',teal,0,28);
    // 주어진 조건(AB = AC, ∠A의 이등분선)만 표시. 나머지는 교사가 펜으로.
    pfInkPaint();
  }

  /* ── 5.3 외심 증명 ── */
  function pfDrawCircum(s,ink,teal,blue,red){
    const t=pfTri(), A=t.A, B=t.B, C=t.C;
    const O=circumcenter(A,B,C), Mbc=mid(B,C), Mca=mid(C,A), D=mid(A,B);
    if(!O) return;
    pfSeg(A,B,ink,3); pfSeg(B,C,ink,3); pfSeg(C,A,ink,3);
    pfLabel(A,'A',ink,0,-24); pfLabel(B,'B',ink,-24,14); pfLabel(C,'C',ink,24,14);
    // BC, CA의 수직이등분선
    pfSeg(O,Mbc,teal,2.4,[7,5]); pfTick(B,Mbc,1,teal); pfTick(Mbc,C,1,teal);
    pfRight(Mbc, sub(O,Mbc), sub(C,Mbc), teal);
    pfSeg(O,Mca,teal,2.4,[7,5]); pfTick(C,Mca,1,teal); pfTick(Mca,A,1,teal);
    pfRight(Mca, sub(O,Mca), sub(A,Mca), teal);
    pfDot2(O,red,6); pfLabel(O,'O',red,16,-14);
    // 증명 단계에서는 주어진 조건만 표시(OA·OB·OC 등은 교사가 펜으로).
    // 외접원 개념을 도입하는 마지막 단계에서만 원을 그린다.
    if(s>=8) pfCircleFull(O, dist(O,A), blue);
    pfInkPaint();
  }

  /* ── 5.4 내심 증명 ── */
  function pfDrawIncenter(s,ink,teal,blue,red){
    const t=pfTri(), A=t.A, B=t.B, C=t.C;
    const I=incenter(A,B,C);
    if(!I) return;
    const D=footPerp(I,A,B), E=footPerp(I,B,C), F=footPerp(I,C,A);
    pfSeg(A,B,ink,3); pfSeg(B,C,ink,3); pfSeg(C,A,ink,3);
    pfLabel(A,'A',ink,0,-24); pfLabel(B,'B',ink,-24,14); pfLabel(C,'C',ink,24,14);
    // ∠A, ∠B의 이등분선
    const dA=norm(add(norm(sub(B,A)), norm(sub(C,A)))), fA=lineX(A,dA,B,sub(C,B));
    const dB=norm(add(norm(sub(A,B)), norm(sub(C,B)))), fB=lineX(B,dB,A,sub(C,A));
    if(fA) pfSeg(A,fA,teal,2.4,[7,5]);
    if(fB) pfSeg(B,fB,teal,2.4,[7,5]);
    pfArc(A,B,I,40,teal); pfArc(A,I,C,48,teal);
    pfArc(B,I,A,40,teal); pfArc(B,C,I,48,teal);
    pfDot2(I,red,6); pfLabel(I,'I',red,16,-14);
    pfLabel(D,'D',blue,-16,-8); pfLabel(E,'E',blue,0,24); pfLabel(F,'F',blue,18,-8);
    // 처음 조건: I에서 세 변에 내린 수선(=수선의 발 D, E, F)까지가 주어진 상태
    pfSeg(I,D,blue,2.6); pfSeg(I,E,blue,2.6); pfSeg(I,F,blue,2.6);
    pfRight(D, sub(I,D), sub(B,D), blue);
    pfRight(E, sub(I,E), sub(C,E), blue);
    pfRight(F, sub(I,F), sub(A,F), blue);
    // ID=IE=IF 표시, IC, ∠ICE=∠ICF 등은 그리지 않는다 — 교사가 펜으로.
    // 내접원 개념을 도입하는 마지막 단계에서만 원을 그린다.
    if(s>=8) pfCircleFull(I, dist(I,E), blue);
    pfInkPaint();
  }
  function pfCircleFull(O,r,color){
    pfCtx.save(); pfCtx.strokeStyle=color; pfCtx.lineWidth=2.6;
    pfCtx.beginPath(); pfCtx.arc(O.x,O.y,r,0,Math.PI*2); pfCtx.stroke(); pfCtx.restore();
  }
  /* ── 6단원 증명용 사각형 (A 왼쪽위 → B 왼쪽아래 → C 오른쪽아래 → D 오른쪽위) ── */
  function pfQuadPts(kind){
    const w=Math.min(pfFW*0.34, pfH*0.52);     // 가로 변 길이
    const h=Math.min(pfH*0.46, pfFW*0.30);     // 세로 높이
    const cx=pfFW*0.5, cy=pfH*0.52;
    let skew=h*0.42;                            // 기울기(평행사변형)
    if(kind==='rect') skew=0;
    if(kind==='rhombus'){
      // 마름모: 대각선이 가로·세로인 모양으로 둔다
      const a=Math.min(pfFW*0.22, pfH*0.40), b=Math.min(pfH*0.34, pfFW*0.20);
      return { A:{x:cx, y:cy-b}, B:{x:cx-a, y:cy}, C:{x:cx, y:cy+b}, D:{x:cx+a, y:cy} };
    }
    const B={x:cx-w/2-skew/2, y:cy+h/2};
    const C={x:cx+w/2-skew/2, y:cy+h/2};
    const A={x:B.x+skew,      y:cy-h/2};
    const D={x:C.x+skew,      y:cy-h/2};
    return {A,B,C,D};
  }
  function pfDrawQuad(kind, s, ink, teal, blue, red){
    const q=pfQuadPts(kind), A=q.A, B=q.B, C=q.C, D=q.D;
    pfSeg(A,B,ink,3); pfSeg(B,C,ink,3); pfSeg(C,D,ink,3); pfSeg(D,A,ink,3);
    if(kind==='rhombus'){
      pfLabel(A,'A',ink,0,-22); pfLabel(B,'B',ink,-22,0);
      pfLabel(C,'C',ink,0,24);  pfLabel(D,'D',ink,22,0);
    } else {
      pfLabel(A,'A',ink,-20,-14); pfLabel(B,'B',ink,-20,16);
      pfLabel(C,'C',ink,20,16);   pfLabel(D,'D',ink,20,-14);
    }
    // 주어진 조건만 표시 (나머지는 교사가 펜으로)
    if(kind==='para'){                       // 대변 길이가 같다는 조건
      pfTick(A,B,1); pfTick(D,C,1);
      pfTick(B,C,2); pfTick(A,D,2);
    }
    if(kind==='paraDiag' || kind==='rect' || kind==='rhombus'){
      pfSeg(A,C,teal,2.2); pfSeg(B,D,teal,2.2);
      const O=lineX(A,sub(C,A),B,sub(D,B));
      if(O){ pfDot2(O,red,5.5); pfLabel(O,'O',red,16,-12); }
    }
    if(kind==='paraDiag'){
      const O=lineX(A,sub(C,A),B,sub(D,B));
      if(O){ pfTick(A,O,1,teal); pfTick(O,C,1,teal); pfTick(B,O,2,teal); pfTick(O,D,2,teal); }
    }
    if(kind==='rect'){
      [[A,D,B],[B,A,C],[C,B,D],[D,C,A]].forEach(([P,X,Y])=>pfRight(P, sub(X,P), sub(Y,P)));
    }
    if(kind==='rhombus'){
      pfTick(A,B,1); pfTick(B,C,1); pfTick(C,D,1); pfTick(D,A,1);
    }
  }
  function pfDot2(p,color,r){
    pfCtx.save(); pfCtx.fillStyle=color;
    pfCtx.beginPath(); pfCtx.arc(p.x,p.y,r||5,0,Math.PI*2); pfCtx.fill(); pfCtx.restore();
  }

  function pfAnimateTo(step){
    const from={flip:pf.flip, move:pf.move}, to=pfTarget(step);
    if(from.flip===to.flip && from.move===to.move){ pf.flip=to.flip; pf.move=to.move; pfDraw(); return; }
    if(pf.anim) cancelAnimationFrame(pf.anim);
    // 탭이 가려져 있으면 rAF가 멈추므로 바로 목표 상태로
    if(document.hidden){ pf.flip=to.flip; pf.move=to.move; pfDraw(); return; }
    const t0=performance.now(), dur=700;
    // 안전장치: 애니메이션이 끝까지 못 돌아도 목표 상태는 반드시 맞춘다
    clearTimeout(pf.safety);
    pf.safety=setTimeout(()=>{
      if(pf.flip!==to.flip || pf.move!==to.move){ pf.flip=to.flip; pf.move=to.move; pfDraw(); }
    }, dur+200);
    const tick=now=>{
      const k=Math.min(1,(now-t0)/dur), e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;  // easeInOut
      pf.flip=from.flip+(to.flip-from.flip)*e;
      pf.move=from.move+(to.move-from.move)*e;
      pfDraw();
      if(k<1) pf.anim=requestAnimationFrame(tick); else pf.anim=null;
    };
    pf.anim=requestAnimationFrame(tick);
  }

  function pfRender(){
    const def=pfDef(), n=def.steps.length;
    document.getElementById('pfNum').textContent='단계 '+(pf.step+1)+' / '+n+'  ·  '+def.name;
    // 지금까지의 과정을 아래에 쌓아 보여준다(칠판 판서처럼)
    const log=document.getElementById('pfLog'); log.innerHTML='';
    for(let i=0;i<=pf.step;i++){
      const it=document.createElement('div');
      it.className='item'+(i===pf.step?' cur':'');
      it.innerHTML='<span class="n">'+(i+1)+'</span>';
      const sp=document.createElement('span'); sp.textContent=def.steps[i];
      it.appendChild(sp); log.appendChild(it);
    }
    pfFitLog();
    const last=log.lastElementChild; if(last) last.scrollIntoView({block:'nearest'});
    const dots=document.getElementById('pfDots'); dots.innerHTML='';
    for(let i=0;i<n;i++){ const d=document.createElement('i'); if(i<=pf.step) d.className='on'; dots.appendChild(d); }
    document.getElementById('pfPrev').disabled = pf.step===0;
    document.getElementById('pfNext').disabled = pf.step===n-1;
    pfAnimateTo(pf.step);
  }
  // 증명 과정이 스크롤 없이 한 화면에 들어오도록 글자 크기를 줄여 맞춘다.
  // (아이패드처럼 세로가 짧은 화면 / 단계가 많은 증명 대응)
  function pfFitLog(){
    const log=document.getElementById('pfLog');
    if(!log || !log.clientHeight) return;
    // 읽을 수 있는 최소 크기(15px)까지만 줄인다. 그래도 안 들어가면 스크롤하되
    // 현재 단계는 pfRender에서 항상 보이게 맞춘다.
    let fs=Math.min(23, Math.max(15, Math.round(window.innerWidth*0.0132)));
    for(let i=0;i<10;i++){
      log.style.setProperty('--pfFs', fs+'px');
      if(log.scrollHeight <= log.clientHeight+1 || fs<=15) break;
      fs-=1;
    }
  }
  function pfGo(d){
    const n=pfDef().steps.length;
    pf.step=Math.max(0, Math.min(n-1, pf.step+d));
    pfRender();
  }
  function pfReset(){ pf.step=0; pf.flip=0; pf.move=0; pfStrokes=[]; pfCur=null; pfRender(); }
  function pfSetType(t){ pf.type=t; pf.step=0; pf.flip=0; pf.move=0; pfStrokes=[]; pfCur=null; pfSyncPicker(); pfRender(); }
  function pfSyncPicker(){
    document.querySelectorAll('#pfPicker .chip').forEach(b=>b.classList.toggle('on', b.dataset.t===pf.type));
  }
  function pfRenderPicker(){
    const box=document.getElementById('pfPicker'); box.innerHTML='';
    const keys=(CONFIG.proof||[]).filter(k=>PROOFS[k]);
    if(keys.length<2){ box.style.display='none'; return; }   // 증명이 하나뿐이면 선택칩 숨김
    keys.forEach(k=>{
      const b=document.createElement('button');
      b.className='chip'; b.dataset.t=k; b.textContent=PROOFS[k].name;
      b.onclick=()=>pfSetType(k); box.appendChild(b);
    });
    pfSyncPicker();
  }
  function pfResize(){
    if(!pfCv||!pfWrap) return;
    const w=pfWrap.clientWidth, h=pfWrap.clientHeight;
    if(!w||!h) return;
    // 도형 영역 폭은 크기 변화가 없을 때에도 다시 계산한다(단계 글 표시 전환 때문)
    pfFW = pfLogOn ? w : Math.round(w*PF_FIG_FRAC);
    if(pfW===w && pfH===h){ pfDraw(); pfFitLog(); return; }
    pfCv.width=w; pfCv.height=h; pfW=w; pfH=h; pfDraw(); pfFitLog();
  }
  // 단계 글 패널 보이기/숨기기. 숨기면 캔버스가 화면을 다 쓰고 오른쪽이 필기 공간이 된다.
  function pfToggleLog(){
    pfLogOn=!pfLogOn;
    document.getElementById('pfMain').classList.toggle('nolog', !pfLogOn);
    const b=document.getElementById('pfLogBtn');
    if(b) b.textContent = pfLogOn ? '단계 글 숨기기' : '단계 글 보기';
    // 레이아웃이 바뀐 뒤 폭을 다시 재야 한다(ResizeObserver보다 먼저 한 번 더)
    pfResize(); requestAnimationFrame(pfResize);
  }

  /* ══════════════ 화면 전환 ══════════════ */
  let currentView='explore';
  function showView(v){
    currentView=v;
    document.getElementById('tabExplore').classList.toggle('active', v==='explore');
    document.getElementById('tabProof').classList.toggle('active', v==='proof');
    document.getElementById('tabSolve').classList.toggle('active', v==='solve');
    document.getElementById('tabDash').classList.toggle('active', v==='dash');
    document.getElementById('viewExplore').style.display = v==='explore'?'block':'none';
    document.getElementById('viewProof').style.display   = v==='proof'?'block':'none';
    document.getElementById('viewSolve').style.display   = v==='solve'?'block':'none';
    document.getElementById('viewDash').style.display    = v==='dash'?'block':'none';
    document.body.classList.toggle('proofmode', v==='proof');
    if(v==='explore') setTimeout(exResize,0);
    if(v==='solve')   setTimeout(resize,0);
    if(v==='proof')   setTimeout(()=>{ pfResize(); pfRender(); },0);
  }

  /* ══════════════ 제출 ══════════════ */
  function myKeys(){ const k=localStorage.getItem('cls_'+CONFIG.folder); return k?JSON.parse(k):[]; }
  function saveKey(k){ const a=myKeys(); if(!a.includes(k)){ a.push(k); localStorage.setItem('cls_'+CONFIG.folder, JSON.stringify(a)); } }

  function sendSubmission(cls, name, pIdx, label, dataUrl, btn, okMsg){
    const ref=database.ref(DB_PATH).push();
    saveKey(ref.key);
    ref.set({ class:cls, name:name, pIdx:pIdx, label:label, img:dataUrl, time:Date.now() })
      .then(()=>{ alert(okMsg); btn.disabled=false; btn.textContent=btn.dataset.txt; refreshMyRecords(); })
      .catch(()=>{ alert('전송에 실패했어요. 다시 시도해 주세요.'); btn.disabled=false; btn.textContent=btn.dataset.txt; });
  }

  function submitAnswer(){
    if(!database){ alert('인터넷 연결이 필요해요.'); return; }
    const cls=document.getElementById('stuClass').value;
    const name=document.getElementById('stuName').value.trim();
    if(!cls||!name){ alert('반과 이름을 입력해 주세요.'); return; }
    if(!strokes.some(s=>!s.erase)){ alert('노트에 풀이를 적어 주세요.'); return; }
    const btn=document.getElementById('submitBtn');
    btn.dataset.txt='풀이 제출하기'; btn.disabled=true; btn.textContent='전송 중...';
    sendSubmission(cls, name, activeIdx, PROBLEMS[activeIdx].label, cv.toDataURL('image/png'), btn,
      '제출되었습니다! 아래 “내가 제출한 풀이”에서 확인할 수 있어요.');
  }

  function submitExplore(){
    if(!database){ alert('인터넷 연결이 필요해요.'); return; }
    const cls=document.getElementById('exClass').value;
    const name=document.getElementById('exName').value.trim();
    if(!cls||!name){ alert('반과 이름을 입력해 주세요.'); return; }
    const btn=document.getElementById('exSubmitBtn');
    btn.dataset.txt='탐구 화면 제출'; btn.disabled=true; btn.textContent='전송 중...';
    sendSubmission(cls, name, EXPLORE_IDX, '탐구', exCv.toDataURL('image/png'), btn,
      '탐구 화면이 제출되었습니다!');
  }

  function refreshMyRecords(){
    if(!database||isTeacher) return;
    database.ref(DB_PATH).once('value').then(snap=>{
      const keys=myKeys(); const mine=[];
      snap.forEach(c=>{ if(keys.includes(c.key)) mine.push({id:c.key, ...c.val()}); });
      mine.sort((a,b)=>b.time-a.time);
      renderMy(mine);
    });
  }

  const recCache={};
  function renderMy(data){
    const wrap=document.getElementById('myRecords'), g=document.getElementById('myGrid');
    wrap.style.display='block';
    if(!data.length){ g.innerHTML='<p style="color:var(--sub); font-size:14px;">아직 제출한 풀이가 없어요.</p>'; return; }
    g.innerHTML='';
    data.forEach(d=>{
      recCache[d.id]=d;
      const t=new Date(d.time), ts=`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
      const el=document.createElement('div'); el.className='rec';
      el.innerHTML=`<div class="rtop"><span>${d.label}</span><span class="tag ok">제출됨</span></div>
        <img src="${d.img}" onclick="openInspect('${d.id}')">
        <div class="rbot">${ts} 제출</div>`;
      g.appendChild(el);
    });
  }

  /* ══════════════ 교사 대시보드 ══════════════ */
  function initTeacherOrStudent(){
    if(isTeacher){
      const _tabs=document.getElementById('studentTabs'), _qt=document.getElementById('qrThumb');
      document.getElementById('tabDash').style.display='';
      _tabs.style.alignItems='flex-end';
      _tabs.appendChild(_qt);
      _qt.style.position='static'; _qt.style.marginLeft='auto'; _qt.style.paddingBottom='4px';
      document.getElementById('viewExplore').style.display='none';
      document.getElementById('viewSolve').style.display='none';
      showView('dash');
      document.getElementById('statusTxt').textContent='교사 모드';
      const url=location.origin+location.pathname;
      if(typeof QRCode!=='undefined'){
        new QRCode(document.getElementById('qrSmall'),{text:url,width:38,height:38,colorDark:'#1A1A1A'});
        new QRCode(document.getElementById('qrBig'),{text:url,width:260,height:260,colorDark:'#1A1A1A'});
        document.getElementById('qrThumb').style.display='block';
      }
      if(database){
        database.ref('.info/connected').on('value',s=>{ const on=s.val(); document.getElementById('dot').classList.toggle('on',on); document.getElementById('statusTxt').textContent=on?'교사 모드':'오프라인'; });
        database.ref(DB_PATH).on('value', snap=>{
          window.allData=[]; snap.forEach(c=>{ window.allData.push({id:c.key, ...c.val()}); });
          window.allData.sort((a,b)=>b.time-a.time);
          renderDash();
        }, err=>console.warn('구독 오류',err));
      }
    } else {
      if(database){
        database.ref('.info/connected').on('value',s=>{ const on=s.val(); document.getElementById('dot').classList.toggle('on',on); document.getElementById('statusTxt').textContent=on?'연결됨':'오프라인'; });
        database.ref(DB_PATH).on('value', snap=>{
          const keys=myKeys(), mine=[];
          snap.forEach(c=>{ if(keys.includes(c.key)) mine.push({id:c.key, ...c.val()}); });
          mine.sort((a,b)=>b.time-a.time);
          renderMy(mine);
        });
      }
    }
  }

  function refreshDash(){
    if(!database) return;
    database.ref(DB_PATH).once('value').then(snap=>{
      window.allData=[]; snap.forEach(c=>{ window.allData.push({id:c.key, ...c.val()}); });
      window.allData.sort((a,b)=>b.time-a.time);
      renderDash();
    });
  }

  function renderDash(){
    const cf=document.getElementById('fClass').value;
    const pf=document.getElementById('fProblem').value;
    const g=document.getElementById('dashGrid');
    const data=(window.allData||[]).filter(d=>(cf==='all'||d.class===cf)&&(pf==='all'||String(d.pIdx)===pf));
    if(!data.length){ g.innerHTML='<p style="color:var(--sub); font-size:15px; padding:8px;">아직 제출된 풀이가 없습니다.</p>'; return; }

    const groups={};
    data.forEach(d=>{ const k=String(d.pIdx); (groups[k]=groups[k]||[]).push(d); });

    const order=[{key:String(EXPLORE_IDX), label:'탐구'}].concat(PROBLEMS.map((p,i)=>({key:String(i), label:p.label})));
    g.innerHTML='';
    order.forEach(sec=>{
      const items=groups[sec.key]||[]; if(!items.length) return;
      const box=document.createElement('div'); box.className='dash-section';
      box.innerHTML=`<div class="dash-section-title">${sec.label} <span class="cnt">${items.length}명 제출</span></div>`;
      const grid=document.createElement('div'); grid.className='grid';
      items.forEach(d=>{
        recCache[d.id]=d;
        const t=new Date(d.time), ts=`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
        const el=document.createElement('div'); el.className='rec';
        el.innerHTML=`<div class="rtop"><span>${d.class}반 ${d.name}</span><button class="del" onclick="delRec('${d.id}')">삭제</button></div>
          <img src="${d.img}" onclick="openInspect('${d.id}')">
          <div class="rbot">${ts} 제출</div>`;
        grid.appendChild(el);
      });
      box.appendChild(grid); g.appendChild(box);
    });
  }

  function delRec(id){ if(database && confirm('이 제출을 삭제할까요?')) database.ref(DB_PATH+'/'+id).remove(); }

  /* ── 모달 ── */
  function openInspect(id){
    const d=recCache[id]; if(!d) return;
    document.getElementById('inspectImg').src=d.img;
    document.getElementById('inspectInfo').textContent = isTeacher ? `${d.class}반 ${d.name} · ${d.label}` : d.label;
    openModal('inspectModal');
  }
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }

  /* ══════════════ 입력 라우터 (마우스 / 손가락 / 애플펜슬) ══════════════
     아이패드에서 펜으로 쓸 때 손바닥이 화면에 닿아도 선이 그어지지 않도록
     펜이 쓰이는 동안에는 손가락 입력을 무시한다(팜 리젝션).
     - 손바닥이 펜보다 먼저 닿아 획이 시작됐으면 그 획을 취소한다.
     - 펜을 뗀 뒤 PEN_GRACE 동안은 손가락을 무시(글씨 쓰는 중 손 재배치 대응).
     - 펜을 한동안 안 쓰면 손가락도 다시 쓸 수 있다. */
  let penLastTs = 0;
  const PEN_GRACE = 1500;

  function bindDrawInput(el, h){
    if(!window.PointerEvent){                 // 아주 오래된 브라우저 대비
      el.addEventListener('mousedown', h.down);
      el.addEventListener('mousemove', h.move);
      window.addEventListener('mouseup', h.up);
      el.addEventListener('touchstart', e=>{ e.preventDefault(); h.down(e); }, {passive:false});
      el.addEventListener('touchmove',  e=>{ e.preventDefault(); h.move(e); }, {passive:false});
      el.addEventListener('touchend',   e=>{ e.preventDefault(); h.up(e);   }, {passive:false});
      return;
    }
    let activeId=null, activeType=null;

    el.addEventListener('pointerdown', e=>{
      if(e.pointerType==='pen'){
        penLastTs=Date.now();
        if(activeType==='touch' && h.cancel) h.cancel();   // 손바닥이 시작한 획 버리기
        activeId=e.pointerId; activeType='pen';
      } else if(e.pointerType==='touch'){
        if(activeType==='pen') return;
        if(Date.now()-penLastTs < PEN_GRACE) return;
        if(activeId!==null) return;                        // 멀티터치는 첫 손가락만
        activeId=e.pointerId; activeType='touch';
      } else {
        if(activeId!==null) return;
        activeId=e.pointerId; activeType='mouse';
      }
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      h.down(e);
    }, {passive:false});

    el.addEventListener('pointermove', e=>{
      if(e.pointerType==='pen') penLastTs=Date.now();
      if(e.pointerId!==activeId) return;
      e.preventDefault();
      h.move(e);
    }, {passive:false});

    function end(e){
      if(e.pointerId!==activeId) return;
      if(e.pointerType==='pen') penLastTs=Date.now();
      activeId=null; activeType=null;
      h.up(e);
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    window.addEventListener('pointerup', e=>{ if(e.pointerId===activeId) end(e); });
  }

  /* ══════════════ 시작 ══════════════ */
  window.onload=()=>{
    document.getElementById('pageTitle').textContent=CONFIG.title;
    document.title=CONFIG.title;

    cv=document.getElementById('cv'); ctx=cv.getContext('2d'); skwrap=document.getElementById('skwrap');
    exCv=document.getElementById('ex'); exCtx=exCv.getContext('2d'); exWrap=document.getElementById('exwrap');
    pfCv=document.getElementById('pf'); pfCtx=pfCv.getContext('2d'); pfWrap=document.getElementById('pfwrap');

    // 증명 화면은 교사에게만 보인다 (학생이 먼저 넘겨보지 못하도록)
    const proofKeys=(CONFIG.proof||[]).filter(k=>PROOFS[k]);
    if(isTeacher && proofKeys.length){
      document.getElementById('tabProof').style.display='';
      pf.type=proofKeys[0];
      pfLoadImages();
      pfRenderPicker(); pfRender();
    }

    // 증명 화면 필기 입력
    bindDrawInput(pfCv, { down:pfDown, move:pfMove, up:pfUp,
      cancel:()=>{ pfCur=null; pfDrag=false; pfDraw(); } });

    document.getElementById('exTitle').textContent=exDef.title;
    document.getElementById('exSub').textContent=exDef.sub;
    exRenderTools();

    // 문제 캔버스 입력
    bindDrawInput(cv, { down:startDraw, move:moveDraw, up:endDraw,
      cancel:()=>{ curStroke=null; dragging=false; draw(); } });

    // 탐구 캔버스 입력
    bindDrawInput(exCv, { down:exDown, move:exMove, up:exUp,
      cancel:()=>{ ex.drag=null; exDraw(); } });

    initTeacherOrStudent();
    renderProblemBar();
    selectProblem(0);
    if(isTeacher) currentView='dash';

    // 레이아웃이 잡히는 시점이 브라우저마다 달라서, 크기 변화를 관찰해 캔버스를 맞춘다
    if(typeof ResizeObserver!=='undefined'){
      new ResizeObserver(()=>resize()).observe(skwrap);
      new ResizeObserver(()=>exResize()).observe(exWrap);
      new ResizeObserver(()=>pfResize()).observe(pfWrap);
    }
    resize(); exResize(); pfResize();
    requestAnimationFrame(()=>{ resize(); exResize(); pfResize(); });
    setTimeout(()=>{ resize(); exResize(); pfResize(); }, 300);
  };

  window.addEventListener('resize', ()=>{ resize(); exResize(); pfResize(); });
</script>
